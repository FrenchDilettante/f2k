# F2K Workspace
# Windows 2000-compatible OS in Rust

[workspace]
members = [
    "kernel",
]
resolver = "2"

[workspace.dependencies]
# Shared dependencies can be listed here

# Build profiles (cargo only honors them at the workspace root). Panic
# behaviour is not set here: the kernel target spec (x86-f2k.json) already
# says panic-strategy "abort", and a profile-level `panic` would leak into
# the host unit tests' from-source std build and break it.
[profile.release]
opt-level = 2            # Optimize for size/speed
lto = true               # Link-time optimization

# The test kernel's optimized variant: `make ... KERNEL_PROFILE=dev-opt` (target/x86-f2k/dev-opt/,
# beside the dev kernel instead of over it). The kernel crate itself stays unoptimized: optimizing it
# exposes undefined behaviour the dev build tolerates (its intrusive lists are rewritten through raw
# pointers while `&mut` borrows of their owners are live, which `noalias` lets LLVM cache across,
# hanging the timer table's expiry walk). Everything under it is optimized: core, alloc and
# compiler_builtins (memcpy, memset). The debug checks stay on throughout.
[profile.dev-opt]
inherits = "dev"
debug-assertions = true
overflow-checks = true

[profile.dev-opt.package."*"]
opt-level = 2
