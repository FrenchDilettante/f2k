# F2K Workspace
# Windows 2000-compatible OS in Rust

[workspace]
members = [
    "kernel",
    # The boot loader: the Multiboot image that carries the kernel's image, ntoskrnl.exe.
    "kernel/loader",
]
exclude = [
    # The ring-3 code (the system DLLs) is its own workspace, with its own target: userland/.
    "userland",
    # A host library (the build scripts' generator): this workspace builds for the kernel target.
    "tools/exportgen",
]
resolver = "2"

[workspace.dependencies]
# Shared dependencies can be listed here

# No `panic` setting: x86-f2k.json already aborts, and a profile one breaks the host tests.
[profile.release]
opt-level = 2
lto = true

# Optimized, with the debug checks kept: what `make test` boots.
[profile.dev-opt]
inherits = "dev"
opt-level = 2
debug-assertions = true
overflow-checks = true
