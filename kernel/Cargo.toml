[package]
name = "f2k-kernel"
version = "0.1.0"
edition = "2021"
authors = ["F2K Team"]
description = "F2K Kernel - Windows 2000-compatible operating system"
license = "MIT OR Apache-2.0"

# We're building a bare metal kernel binary
[package.metadata.bootloader]
target = "x86-f2k"

# The kernel binary has no test harness (it is no_std/no_main); unit tests
# run against the library target on the host instead (`make run-tests`).
[[bin]]
name = "f2k-kernel"
path = "src/main.rs"
test = false
doctest = false

[features]
# Test-only fault injection (see kmain): raise a CPU exception right after
# boot so the exception stubs and the COM1 dump can be verified on target
# by the fault-ud / fault-gp cases of scripts/qemu-tests.yaml.
fault-test-ud = []
fault-test-gp = []
# Swaps the ring-3 smoke stub for one that reads the supervisor-only
# kernel window, so the user-process-fault path can be verified on
# target by the fault-user case.
fault-test-user = []
# Swaps the ring-3 smoke stub for one that passes an unmapped user
# address as the syscall argument pointer, so faults inside the
# kernel's argument copy end the process: the fault-badargs case.
fault-test-badargs = []
# Swaps the ring-3 smoke stub for one that loads null DS/ES, spins across
# several clock ticks, then exits through the syscall gate: the kernel's
# entry stubs must not run on the user's data segments.
fault-test-segments = []
# Swaps the ring-3 smoke stub for one that raises the internal
# thread-exit service on a boot without user threads, then exits with
# the service's status: the service must be refused, not panic.
fault-test-threadexit = []
# Loads the second corpus fixture (ret0.exe, the 35-import CRT startup
# surface) instead of the first: the ret0 suite cases build with it.
run-ret0 = []
# Loads the console fixture (hello.exe, the 40-import console-stdio
# surface) instead of the first: the hello suite cases build with it.
run-hello = []
# The blocking-wait smoke boot: the pingpong fixture runs with the
# thread-ified entry — the main thread enters ring 3 through the
# scheduler's first switch, and its CreateThread/CreateEventA/
# SetEvent/WaitForSingleObject calls run against the wait
# machinery. The qemu-tests.yaml cases pin the captured output.
run-pingpong = []
# The timer smoke boot: the sleep fixture runs with the thread-ified
# entry — Sleep parks the main thread in the timer table (the idle
# thread owns the processor while it sleeps), the timed wait blocks
# on a never-signaled event until its timeout, and GetTickCount
# reads the tick count. The qemu-tests.yaml cases pin the captured
# output.
run-sleep = []
# The preemption smoke boot: the spin fixture runs with the
# thread-ified entry — two same-priority spinners alternate at
# quantum ends (round-robin from the tick), a third thread raised
# above them runs its block uninterrupted (the service-boundary
# delivery), and the checksums prove the work loops completed
# under preemption. The qemu-tests.yaml cases pin the captured
# shape.
run-spin = []
# The thread-slot reuse smoke boot: the respawn fixture runs with
# the thread-ified entry — three rounds of create, wait for, close
# (one child alive at a time), so every child after the first
# reuses the gate-stack resources the previous one released at its
# exit. The qemu-tests.yaml cases pin the captured output.
run-respawn = []
# The multi-process suite case: exit0, ret0, bsscheck, bsscheck,
# crash, exit0 run in sequence in one boot, each process torn down
# and audited before the next starts. The sequence runner and the
# per-process teardown are the runner's deliverables; the
# qemu-tests.yaml cases pin the COM1 shapes.
run-process-suite = []
# The interrupt/timer diagnostic boot:
# a boot-time pass that reports the PIC remap, the PIT programming at
# the captured 10.0144 ms tick, the live tick counter, the clock-ISR
# DPC, and the interrupt-core audit on COM1, then lets the normal boot
# proceed to the default image's exit — proving coexistence, not just
# the diagnostic. The tick itself is default-on kernel machinery; the
# feature gates only the diagnostic lines and the bounded tick wait.
# The qemu-tests.yaml cases pin the COM1 shapes.
irq-smoke = []
# The IDE diagnostic boot: after the driver comes up, a boot-time pass
# reads the drive's identity, the MBR, the volume boot sector, and the
# first fixture's sector through the IRQ14-driven read path and reports
# them on COM1, then lets the normal boot proceed to the default image's
# exit — coexistence, not just the diagnostic. The driver itself is
# default-on kernel machinery; the feature gates only the diagnostic
# lines. Disk path only (the image is the IDE primary master); the
# qemu-tests.yaml case pins the COM1 shapes.
disk-smoke = []

[dependencies]
# Core no_std crates for future use
# spin = "0.9.8"        # Spinlocks and mutable statics
# bitflags = "2.0"      # Bit flags
# itoa = "1.0"          # Integer to ASCII conversion (no_std compatible)

# Build profiles live in the workspace root's Cargo.toml: cargo ignores
# profiles in member packages.
