[package]
name = "f2k-kernel"
version = "0.1.0"
edition = "2021"
authors = ["F2K Team"]
description = "F2K Kernel - Windows 2000-compatible operating system"
license = "MIT OR Apache-2.0"

# We're building a bare metal kernel binary
[package.metadata.bootloader]
target = "x86-f2k"

# The kernel binary has no test harness (it is no_std/no_main); unit tests
# run against the library target on the host instead (`make run-tests`).
[[bin]]
name = "f2k-kernel"
path = "src/main.rs"
test = false
doctest = false

[features]
# Test-only fault injection (see kmain): raise a CPU exception right after
# boot so the exception stubs and the COM1 dump can be verified on target
# by the fault-ud / fault-gp cases of tests/core/kernel/test_kernel.py.
fault-test-ud = []
fault-test-gp = []
# Swaps the ring-3 smoke stub for one that passes an unmapped user
# address as the syscall argument pointer, so faults inside the
# kernel's argument copy end the process: the fault-badargs case.
fault-test-badargs = []
# Swaps the ring-3 smoke stub for one that loads null DS/ES, spins across
# several clock ticks, then exits through the syscall gate: the kernel's
# entry stubs must not run on the user's data segments.
fault-test-segments = []
# Swaps the ring-3 smoke stub for one that raises the internal
# thread-exit service on a boot without user threads, then exits with
# the service's status: the service must be refused, not panic.
fault-test-threadexit = []
# Swaps the ring-3 smoke stub for one that ends its process while a
# second thread is inside a disk read (ExitProcess against a ReadFile
# blocked on the drive), then checks after the teardown that the volume
# is usable again: the lock released, the drive between commands.
fault-test-exitio = []
# Swaps the ring-3 smoke stub for one that raises NtClose by Windows
# 2000's service number (0x18) on a handle naming nothing, then exits
# with the status: the NT service table must answer STATUS_INVALID_HANDLE.
fault-test-ntclose = []
# The interrupt/timer diagnostic boot: once the interrupt subsystem is up, a
# boot-time pass reports the PIC remap and line masks, the PIT programming
# (read back from channel 0) at the captured 10.0144 ms tick, the live tick
# counter, the clock DPC's timer expiry, and the interrupt-core audit on COM1,
# then lets the normal boot proceed to the default image's exit. The tick is
# default-on kernel machinery; the feature gates only the diagnostic lines and
# their bounded waits. The tests/core/kernel irq-smoke cases pin the COM1 shapes.
irq-smoke = []
# The IDE diagnostic boot: after the driver comes up, a boot-time pass
# reads the drive's identity, the MBR, the volume boot sector, and the
# first fixture's sector through the IRQ14-driven read path and reports
# them on COM1, then lets the normal boot proceed to the default image's
# exit — coexistence, not just the diagnostic. The driver itself is
# default-on kernel machinery; the feature gates only the diagnostic
# lines. Disk path only (the image is the IDE primary master); the
# tests/core/kernel case pins the COM1 shapes.
disk-smoke = []
# The keyboard diagnostic boot: the keyboard driver's DPC reports on COM1
# each byte it takes from the controller (the keyboard's replies to the
# driver's own commands marked) and each record the console's producer
# appends to the input buffer, as the buffer holds it (down or up, the
# virtual key, the scan code, the character, the control-key state, the
# repeat count). The driver itself is default-on kernel machinery; the
# feature gates only the diagnostic lines. tests/core/test_input.py drives keys
# through QEMU's monitor and pins them.
kbd-smoke = []
# The opt-in performance trace: the interval clock's interrupt samples the
# interrupted context and its frame-pointer call stack into a static ring
# buffer, and the boot's end dumps it on COM1 before the line the harness
# stops the boot on. The suite's `--perf-trace` builds with it (forcing frame
# pointers, per the Makefile) and turns each boot's log into a
# profiler.firefox.com profile. Nothing of the trace compiles without it.
perf-trace = []

# The build script generates the kernel's service registry from the system DLLs' export specs
# (userland/<dll>/exports.toml) and points the kernel at the DLLs it embeds.
[build-dependencies]
exportgen = { path = "../tools/exportgen" }

[dependencies]
# The runtime library the system DLLs compile too (as Windows 2000's Rtl is linked into both ntdll
# and ntoskrnl): the code page tables, the console server's rules.
rtl = { path = "../userland/rtl" }
# Core no_std crates for future use
# spin = "0.9.8"        # Spinlocks and mutable statics
# bitflags = "2.0"      # Bit flags
# itoa = "1.0"          # Integer to ASCII conversion (no_std compatible)

# Build profiles live in the workspace root's Cargo.toml: cargo ignores
# profiles in member packages.
