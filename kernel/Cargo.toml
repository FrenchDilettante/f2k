[package]
name = "f2k-kernel"
version = "0.1.0"
edition = "2021"
authors = ["F2K Team"]
description = "F2K Kernel - Windows 2000-compatible operating system"
license = "MIT OR Apache-2.0"

# We're building a bare metal kernel binary
[package.metadata.bootloader]
target = "x86-f2k"

# The kernel binary has no test harness (it is no_std/no_main); unit tests
# run against the library target on the host instead (`make run-tests`).
[[bin]]
name = "f2k-kernel"
path = "src/main.rs"
test = false
doctest = false

[features]
# Test-only fault injection (see kmain): raise a CPU exception right after
# boot so the exception stubs and the COM1 dump can be verified on target
# with `make test-fault-ud` / `make test-fault-gp`.
fault-test-ud = []
fault-test-gp = []
# Swaps the ring-3 smoke stub for one that reads the supervisor-only
# kernel window, so the user-process-fault path can be verified on
# target with `make test-fault-user`.
fault-test-user = []
# Swaps the ring-3 smoke stub for one that passes an unmapped user
# address as the syscall argument pointer, so faults inside the
# kernel's argument copy end the process: `make test-fault-badargs`.
fault-test-badargs = []
# Loads the second corpus fixture (ret0.exe, the 35-import CRT startup
# surface) instead of the first: the ret0 suite cases build with it.
run-ret0 = []
# Loads the console fixture (hello.exe, the 40-import console-stdio
# surface) instead of the first: the hello suite cases build with it
# (docs/plans/console-observable.md).
run-hello = []
# The multi-process suite case: exit0, ret0, bsscheck, bsscheck,
# crash, exit0 run in sequence in one boot, each process torn down
# and audited before the next starts (see
# docs/plans/foundational-processes.md). The sequence runner and the
# per-process teardown are the process workstream's deliverables; the
# qemu-tests.yaml cases pin the COM1 shapes and fail until they land.
run-process-suite = []

[dependencies]
# Core no_std crates for future use
# spin = "0.9.8"        # Spinlocks and mutable statics
# bitflags = "2.0"      # Bit flags
# itoa = "1.0"          # Integer to ASCII conversion (no_std compatible)

[profile.dev]
panic = "abort"          # Abort on panic (we have no unwinding)
opt-level = 0            # No optimization for debugging

[profile.release]
panic = "abort"          # Abort on panic
opt-level = 2            # Optimize for size/speed
lto = true               # Link-time optimization
