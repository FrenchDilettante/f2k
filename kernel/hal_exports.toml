# --- Interrupts ------------------------------------------------------------------------------

[[export]]
name = "HalGetInterruptVector"
group = "interrupt"
args = ["i32 InterfaceType", "u32 BusNumber", "u32 BusInterruptLevel", "u32 BusInterruptVector", "ptr Irql", "ptr Affinity"]
impl = { native = "HalGetInterruptVector" }

[[export]]
name = "HalEnableSystemInterrupt"
group = "interrupt"
args = ["u32 Vector", "u32 Irql", "i32 Mode"]
fails = "0"
impl = { native = "HalEnableSystemInterrupt" }

[[export]]
name = "HalDisableSystemInterrupt"
group = "interrupt"
args = ["u32 Vector", "ptr Irql"]
impl = { native = "HalDisableSystemInterrupt" }

# --- Interval clock and real-time clock ------------------------------------------------------

[[export]]
name = "HalQueryRealTimeClock"
group = "clock"
args = ["ptr TimeFields"]
fails = "0"
impl = { native = "HalQueryRealTimeClock" }

[[export]]
name = "HalSetRealTimeClock"
group = "clock"
args = ["ptr TimeFields"]
fails = "0"
impl = { stub = "the CMOS write path in hw::rtc, landed with the clock slice that needs it" }

[[export]]
name = "HalSetTimeIncrement"
group = "clock"
args = ["u32 DesiredIncrement"]
impl = { native = "HalSetTimeIncrement" }

# --- DMA -------------------------------------------------------------------------------------

[[export]]
name = "HalAllocateCommonBuffer"
group = "dma"
args = ["ptr Adapter", "u32 Length", "ptr LogicalAddress", "boolean CacheEnabled"]
fails = "0"
impl = { native = "HalAllocateCommonBuffer" }
note = "a common buffer over the nonpaged pool, translated to its bus address (mem/dma.rs); one bus, and x86 keeps the buffer cached with the flush keeping DMA coherent, so Adapter and CacheEnabled name nothing here"

[[export]]
name = "HalFreeCommonBuffer"
group = "dma"
args = ["ptr Adapter", "u32 Length", "u64 LogicalAddress", "boolean CacheEnabled"]
fails = "void"
impl = { native = "HalFreeCommonBuffer" }
note = "frees the common buffer named by Length and LogicalAddress (mem/dma.rs)"

[[export]]
name = "HalGetDmaAlignmentRequirement"
group = "dma"
args = []
impl = { native = "HalGetDmaAlignmentRequirement" }
note = "1 on x86: no alignment requirement past the natural one"

# --- Bus data (PCI config space) -------------------------------------------------------------

[[export]]
name = "HalGetBusData"
group = "bus"
args = ["i32 BusDataType", "u32 BusNumber", "u32 SlotNumber", "ptr Buffer", "u32 Length"]
impl = { native = "HalGetBusData" }
note = "PCIConfiguration (4): 0 = no such bus, 2 with VendorID 0xFFFF = empty slot"

[[export]]
name = "HalSetBusData"
group = "bus"
args = ["i32 BusDataType", "u32 BusNumber", "u32 SlotNumber", "ptr Buffer", "u32 Length"]
impl = { native = "HalSetBusData" }

[[export]]
name = "HalGetBusDataByOffset"
group = "bus"
args = ["i32 BusDataType", "u32 BusNumber", "u32 SlotNumber", "ptr Buffer", "u32 Offset", "u32 Length"]
impl = { native = "HalGetBusDataByOffset" }

[[export]]
name = "HalSetBusDataByOffset"
group = "bus"
args = ["i32 BusDataType", "u32 BusNumber", "u32 SlotNumber", "ptr Buffer", "u32 Offset", "u32 Length"]
impl = { native = "HalSetBusDataByOffset" }

# --- MMIO mapping ----------------------------------------------------------------------------

[[export]]
name = "MmMapIoSpace"
group = "mmio"
args = ["u64 PhysicalAddress", "u32 NumberOfBytes", "boolean CacheEnable"]
fails = "0"
impl = { native = "MmMapIoSpace" }
note = "maps the device range into the reserved MMIO region (mem/dma.rs), uncached unless CacheEnable"

# --- Multi-processor -------------------------------------------------------------------------

[[export]]
name = "HalRequestIpi"
group = "mp"
args = ["u32 Mask"]
fails = "void"
impl = { stub = "the APIC slice: the IPI through the local APIC's interrupt command register" }

[[export]]
name = "HalStartNextProcessor"
group = "mp"
args = ["ptr LoaderBlock", "ptr ProcessorState"]
fails = "0"
impl = { stub = "the APIC/MP slice: starting the next processor through its local APIC (INIT-SIPI-SIPI)" }
