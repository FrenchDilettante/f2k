# --- DMA -------------------------------------------------------------------------------------

[[export]]
name = "HalAllocateCommonBuffer"
group = "dma"
args = ["ptr Adapter", "u32 Length", "ptr LogicalAddress", "boolean CacheEnabled"]
fails = "0"
impl = { native = "HalAllocateCommonBuffer" }
ordinal = 21
note = "a physically contiguous common buffer below 4 GiB over the nonpaged pool, its logical address the physical one (mem/dma.rs); one bus, and x86 DMA is cache-coherent, so Adapter and CacheEnabled name nothing here"

[[export]]
name = "HalFreeCommonBuffer"
group = "dma"
args = ["ptr Adapter", "u32 Length", "u64 LogicalAddress", "ptr VirtualAddress", "boolean CacheEnabled"]
fails = "void"
impl = { native = "HalFreeCommonBuffer" }
ordinal = 31
note = "frees the common buffer named by Length, LogicalAddress and VirtualAddress (mem/dma.rs); 24 bytes of arguments"

[[export]]
name = "HalGetDmaAlignmentRequirement"
group = "dma"
args = []
impl = { native = "HalGetDmaAlignmentRequirement" }
internal = true  # not a hal.dll export of the platform's (macro / ntoskrnl's); the body stays for the .sys loader
note = "1 on x86: no alignment requirement past the natural one"

