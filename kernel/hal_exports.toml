# hal.dll's export surface: the one source every list of the HAL-named entry points derives
# from.
#
# F2K compiles the hardware abstraction layer into the kernel image (there is no separate
# hal.dll), so these are not a PE export directory of their own: each record names an entry
# point the drivers import from hal.dll, implemented over the kernel's internal Hal trait in
# kernel/src/hal/exports.rs, whose body is the `f2k_export_<body>` symbol its Rust defines.
# The kernel's build script keeps every body in the link (a generated HAL_EXPORTS table in
# .rodata.hal_exports), where the .sys loader resolves hal.dll imports by name against this
# file, body symbol and all.
#
# Each record is marked one of two ways:
#
# - `impl = { native = "<body>" }` — implemented: the body in kernel/src/hal/exports.rs does
#   the work (over the Hal trait, the port-I/O seam, the PCI config seam, or the routing
#   table), host-tested there.
# - `impl = { stub = "<the work that lands it>" }` — a stub: the body exists and fails the way
#   the export fails, and the reason names the slice that implements it (the APIC/MP slice for
#   the IPI and start-processor entries).
#
# The format is the system DLLs' (userland/kernel32/exports.toml's header documents every
# key), read through tools/exportgen. Records carry no ordinals: the HAL's public header is
# flavor-agnostic, so the real machine's export table (ordinals included) only enters with
# the .sys loader, which needs them for import resolution.
#
# Note: MmMapIoSpace also appears in kernel/exports.toml (catalogued there, where Windows 2000
# exports it from ntoskrnl); that record generates nothing until implemented, so the body
# symbol here is free — implementing it in the kernel's spec later needs its own body name.

convention = "stdcall"

[[group]]
key = "port"
title = "port access (READ_PORT_* / WRITE_PORT_*)"

[[group]]
key = "register"
title = "memory-mapped register access (READ_REGISTER_* / WRITE_REGISTER_*)"

[[group]]
key = "interrupt"
title = "interrupts (HalGetInterruptVector, HalEnable/DisableSystemInterrupt)"

[[group]]
key = "clock"
title = "interval clock and real-time clock"

[[group]]
key = "dma"
title = "DMA (common buffers, alignment)"

[[group]]
key = "bus"
title = "bus data (HalGetBusData / HalSetBusData over PCI config space)"

[[group]]
key = "mmio"
title = "MMIO mapping (MmMapIoSpace)"

[[group]]
key = "mp"
title = "multi-processor (HalRequestIpi, HalStartNextProcessor)"

# --- Port access -----------------------------------------------------------------------------

[[export]]
name = "READ_PORT_UCHAR"
group = "port"
args = ["ptr Port"]
impl = { native = "READ_PORT_UCHAR" }

[[export]]
name = "READ_PORT_USHORT"
group = "port"
args = ["ptr Port"]
impl = { native = "READ_PORT_USHORT" }

[[export]]
