  - export: LCMapStringW
    group: locale
    status: dumped
    note: >-
      fixed in the handler: it swapped LCMAP_LOWERCASE (0x100) and LCMAP_UPPERCASE (0x200); the
      hello trace (the CRT asks 0x100 for its lower case map, 0x200 for its upper) is the contract,
      pinned by lc_map_string_w_maps_case (target-only on the existing path)
    tests:
      - {name: lc_map_string_w_maps_case, enabled: false}
      - {name: lc_map_string_w_refusals_and_size_queries, enabled: false}
