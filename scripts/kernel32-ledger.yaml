      - {name: free_environment_strings_w_succeeds, enabled: false}
  - export: HeapAlloc
    group: heap
    status: enabled
    tests:
      - {name: heap_alloc_serves_aligned_blocks_inside_the_region, enabled: true}
      - {name: heap_alloc_commits_the_region_on_demand, enabled: true}
      - {name: heap_alloc_refuses_foreign_handles_and_oversized_requests, enabled: true}
      - {name: heap_alloc_zeroes_a_reused_block_on_request, enabled: true}
  - export: HeapCreate
    group: heap
    status: enabled
    tests:
      - {name: heap_create_reports_the_heap_handle, enabled: true}
  - export: HeapDestroy
    group: heap
    status: enabled
    note: >-
      fixed in the registry: its stub popped 8 bytes where ret0's call site pushes 4 (the CRT's
      heap-initialization failure path); heap_destroy_pops_one_dword pins the fixture's 4
    tests:
      - {name: heap_destroy_pops_one_dword, enabled: true}
      - {name: heap_destroy_resets_the_heap, enabled: true}
  - export: HeapFree
    group: heap
    status: enabled
    tests:
      - {name: heap_free_releases_live_blocks_only, enabled: true}
      - {name: heap_free_coalesces_neighbors, enabled: true}
  - export: HeapReAlloc
    group: heap
    status: enabled
    note: >-
      a growth is served from the already committed region only: one that needs a commit fails where a HeapAlloc of the same size succeeds (heap_realloc_growth_does_not_commit)
    tests:
      - {name: heap_realloc_grows_by_moving, enabled: true}
      - {name: heap_realloc_shrinking_keeps_the_block, enabled: true}
      - {name: heap_realloc_in_place_only_never_moves, enabled: true}
      - {name: heap_realloc_growth_does_not_commit, enabled: true}
      - {name: heap_realloc_refuses_foreign_handles_and_dead_blocks, enabled: true}
