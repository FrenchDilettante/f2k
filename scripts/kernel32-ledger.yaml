      - {name: flush_file_buffers_succeeds, enabled: false}
  - export: GetLastError
    group: console
    status: unpinned
    reason: >-
      floor (always zero): no service on the surface sets a last error, so its contract is not observable
    tests:
      - {name: get_last_error_answers_with_the_floor, enabled: false}
  - export: SetFilePointer
    group: console
    status: dumped
    tests:
      - {name: set_file_pointer_moves_by_each_method, enabled: false}
      - {name: set_file_pointer_ignores_the_high_word, enabled: false}
      - {name: set_file_pointer_refuses_bad_targets_and_methods, enabled: false}
      - {name: set_file_pointer_refuses_non_file_handles, enabled: false}
  - export: SetStdHandle
