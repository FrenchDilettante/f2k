# The kernel32 contract ledger: every export of the surface, its API group, its
# contract status, and the host scenarios that pin it (kernel/src/compat/harness/groups).
#
# The fixtures (tests/*: the real-machine binaries, traces, and captured outputs)
# are the ground truth: where the existing code disagrees with them, the code is
# wrong, and the scenarios pin the fixtures.
#
# Statuses: pinned (behavior defined from the repository's sources, no scenarios
# yet), dumped (scenarios written, not all enabled), enabled (every scenario
# enabled), unpinned (a gap: `reason` says why, in one line). A scenario is
# enabled exactly when it carries no #[ignore]; a group's `tests` are its
# scenarios over all its members (the stdcall argument blocks).
#
# Report: scripts/kernel32-ledger.py (--check checks this file against the
# scenario sources; --run runs every scenario, disabled ones included, for the
# passing column).

groups:
  - key: termination
    title: termination
    module: kernel/src/compat/harness/groups/termination.rs
    tests:
      - {name: termination_argument_blocks_match_the_prototypes, enabled: false}
  - key: startup
    title: command line / startup info
    module: kernel/src/compat/harness/groups/startup.rs
    tests:
      - {name: startup_argument_blocks_match_the_prototypes, enabled: true}
  - key: console
    title: console handles
    module: kernel/src/compat/harness/groups/console.rs
    tests:
      - {name: console_argument_blocks_match_the_prototypes, enabled: false}
  - key: environment
    title: environment
    module: kernel/src/compat/harness/groups/environment.rs
    tests:
      - {name: environment_argument_blocks_match_the_prototypes, enabled: false}
  - key: heap
    title: heap
    module: kernel/src/compat/harness/groups/heap.rs
    tests:
      - {name: heap_argument_blocks_match_the_prototypes, enabled: true}
  - key: locale
    title: locale / string conversion
    module: kernel/src/compat/harness/groups/locale.rs
    tests:
      - {name: locale_argument_blocks_match_the_prototypes, enabled: false}
  - key: threads
    title: threads / sync
    module: kernel/src/compat/harness/groups/threads.rs
    tests:
      - {name: threads_argument_blocks_match_the_prototypes, enabled: false}
  - key: files
    title: file handles
    module: kernel/src/compat/harness/groups/files.rs
    tests:
      - {name: files_argument_blocks_match_the_prototypes, enabled: false}
  - key: virtual-memory
    title: virtual memory
    module: kernel/src/compat/harness/groups/virtual_memory.rs
    tests:
      - {name: virtual_memory_argument_blocks_match_the_prototypes, enabled: false}

exports:
  - export: ExitProcess
    group: termination
    status: dumped
    tests:
      - {name: exit_process_terminates_with_the_exit_code, enabled: false}
  - export: TerminateProcess
    group: termination
    status: unpinned
    reason: >-
      never-called floor (FALSE, no effect): the corpus imports it but never calls it, so no real behavior is observable
    tests:
      - {name: terminate_process_answers_with_the_floor, enabled: false}
  - export: GetCurrentProcess
    group: termination
    status: dumped
    tests:
      - {name: get_current_process_is_the_pseudo_handle, enabled: false}
  - export: UnhandledExceptionFilter
    group: termination
    status: unpinned
    reason: >-
      never-called floor (zero): the corpus imports it but never calls it, so no real behavior is observable
    tests:
      - {name: unhandled_exception_filter_answers_with_the_floor, enabled: false}
  - export: GetProcAddress
    group: termination
    status: unpinned
    reason: >-
      the system DLLs' exports through the module table (NULL otherwise): the corpus imports it but never calls it, so no real behavior is observable
    tests:
      - {name: get_proc_address_answers_with_the_floor, enabled: false}
  - export: LoadLibraryA
    group: termination
    status: unpinned
    reason: >-
      the system DLLs' handles (NULL for any other module): the corpus imports it but never calls it, so no real behavior is observable
    tests:
      - {name: load_library_answers_with_the_floor, enabled: false}
  - export: RtlUnwind
    group: termination
    status: unpinned
    reason: >-
      never-called floor (returns, unwinds nothing): the corpus imports it but never calls it, so no real behavior is observable
    tests:
      - {name: rtl_unwind_answers_with_the_floor, enabled: false}
  - export: GetCommandLineA
    group: startup
    status: enabled
    tests:
      - {name: get_command_line_points_at_the_staged_command_line, enabled: true}
      - {name: get_command_line_is_the_same_pointer_every_call, enabled: true}
  - export: GetStartupInfoA
    group: startup
    status: dumped
    tests:
      - {name: get_startup_info_returns_zero, enabled: true}
      - {name: get_startup_info_fills_the_replayed_image, enabled: false}
  - export: GetModuleFileNameA
    group: startup
    status: dumped
    tests:
      - {name: get_module_file_name_copies_the_staged_image_path, enabled: false}
      - {name: get_module_file_name_truncates_to_the_buffer, enabled: false}
      - {name: get_module_file_name_refuses_module_handles_and_empty_buffers, enabled: true}
  - export: GetVersion
    group: startup
    status: enabled
    tests:
      - {name: get_version_reports_5_0_build_2195, enabled: true}
  - export: GetStdHandle
    group: console
    status: dumped
    tests:
      - {name: get_std_handle_replays_the_captured_handles, enabled: false}
  - export: GetFileType
    group: console
    status: dumped
    note: >-
      every handle reports FILE_TYPE_CHAR, file handles included
    tests:
      - {name: get_file_type_reports_a_character_device, enabled: false}
  - export: SetHandleCount
    group: console
