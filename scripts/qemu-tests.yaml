# QEMU on-target test suite.
#
# Each case builds the kernel (optionally with cargo features), boots it
# in QEMU via scripts/test-boot.sh, and passes once every expected
# string has appeared on COM1. `image: kernel` boots the freshly built
# kernel ELF through QEMU's Multiboot loader; `image: disk` rebuilds the
# disk image with the case's features (or none) and boots it through
# Limine.
#
# Matching: each expected string is a substring of some COM1 line, in
# any order. `ordered: true` requires them in order, each on a later
# line; `contiguous` lists strings that must match consecutive lines
# (an uninterrupted block); `forbids` lists strings that fail the case
# on sight. "KERNEL PANIC" is forbidden in every case.
#
# Run the whole suite with `make test` (kernel cases) or `make test-disk`
# (disk cases), or the runner directly:
#   scripts/run-qemu-tests.py scripts/qemu-tests.yaml [--only NAME ...]

cases:
  - name: boot-smoke
    description: full boot through the first PE image (exit0) to its exit syscall (kernel path)
    image: kernel
    expects:
      - "F2K Booted Successfully"
      - "F2K: frame database audit: ok"
      - "F2K: kernel heap: alloc/free ok"
      - "F2K: image loaded"
      - "F2K: entering ring 3"
      - "F2K: user process exited normally (exit code=0)"

  - name: fault-ud
    description: "#UD right after init: exception dump without a CPU error code"
    image: kernel
    features: [fault-test-ud]
    expects:
      - "F2K: GDT after load: 0x00cf9b000000ffff 0x00cf93000000ffff"
      - "CPU EXCEPTION: vector 6"
      - "error code 0x00000000"

  - name: fault-gp
    description: "#GP right after init: exception dump with the CPU error code"
    image: kernel
    features: [fault-test-gp]
    expects:
      - "CPU EXCEPTION: vector 13"
      - "error code 0x00000038"

  - name: fault-user
    description: a ring-3 fault ends the user process, not the kernel
    image: kernel
    features: [fault-test-user]
    expects:
      - "F2K: entering ring 3"
      - "CPU EXCEPTION: vector 14"
      - "F2K: user process ended by fault (vector 14); halting"

  - name: fault-badargs
    description: a bad user argument pointer ends the process inside the kernel copy
    image: kernel
    features: [fault-test-badargs]
    expects:
      - "F2K: entering ring 3"
      - "CPU EXCEPTION: vector 14"
      - "F2K: user process ended by fault (bad user argument pointer); halting"

  - name: fault-segments
    description: ring 3 loads the TEB selector into DS/ES and keeps running across ticks and a syscall; the kernel's entry stubs load their own data segments
    image: kernel
    features: [fault-test-segments]
    expects:
      - "F2K: entering ring 3"
      - "F2K: user process exited normally (exit code=7)"

  - name: fault-threadexit
    description: the internal thread-exit service on a boot without user threads is refused (STATUS_INVALID_SYSTEM_SERVICE), not a kernel panic
    image: kernel
    features: [fault-test-threadexit]
    expects:
      - "F2K: entering ring 3"
      - "F2K: user process exited normally (exit code=3221225500)"

  - name: boot-smoke-disk
    description: full boot through the first PE image (exit0) to its exit syscall (Limine disk path)
    image: disk
    expects:
      - "F2K Booted Successfully"
      - "F2K: frame database audit: ok"
      - "F2K: kernel heap: alloc/free ok"
      - "F2K: image loaded"
      - "F2K: entering ring 3"
      - "F2K: user process exited normally (exit code=0)"

  - name: ret0-smoke
    description: the CRT startup fixture runs to main and exits 0 through the 35-import surface (kernel path)
    image: kernel
    features: [run-ret0]
    expects:
      - "F2K Booted Successfully"
      - "F2K: frame database audit: ok"
      - "F2K: kernel heap: alloc/free ok"
      - "F2K: image loaded"
      - "F2K: entering ring 3"
      - "F2K: user process exited normally (exit code=0)"

  - name: ret0-smoke-disk
    description: the CRT startup fixture runs to main and exits 0 through the 35-import surface (Limine disk path)
    image: disk
    features: [run-ret0]
    expects:
      - "F2K Booted Successfully"
      - "F2K: frame database audit: ok"
      - "F2K: kernel heap: alloc/free ok"
      - "F2K: image loaded"
      - "F2K: entering ring 3"
      - "F2K: user process exited normally (exit code=0)"

  # The console-observable corpus: hello runs the ret0 CRT
  # startup, printf writes "Hello, world!" to stdout through
  # WriteFile, then it exits 0 — the program's own output on COM1
  # (no F2K: prefix), before the exit line.
  - name: hello-smoke
    description: the console fixture prints "Hello, world!" as its own COM1 output and exits 0 (kernel path)
    image: kernel
    features: [run-hello]
    expects:
      - "F2K Booted Successfully"
      - "F2K: frame database audit: ok"
      - "F2K: kernel heap: alloc/free ok"
      - "F2K: image loaded"
      - "F2K: entering ring 3"
      - "Hello, world!"
      - "F2K: user process exited normally (exit code=0)"

  - name: hello-smoke-disk
    description: the console fixture prints "Hello, world!" as its own COM1 output and exits 0 (Limine disk path)
    image: disk
    features: [run-hello]
    expects:
      - "F2K Booted Successfully"
      - "F2K: frame database audit: ok"
      - "F2K: kernel heap: alloc/free ok"
      - "F2K: image loaded"
      - "F2K: entering ring 3"
      - "Hello, world!"
      - "F2K: user process exited normally (exit code=0)"


  - name: pingpong-smoke
    description: the blocking-wait smoke runs its captured five-turn alternation through two auto-reset events and a child thread, the child-handle wait returns 0, and the process exits cleanly (kernel path)
    image: kernel
    features: [run-pingpong]
    # The strict alternation is the point: the turns must appear in order.
    ordered: true
    expects:
      - "F2K Booted Successfully"
      - "F2K: frame database audit: ok"
      - "F2K: kernel heap: alloc/free ok"
      - "F2K: image loaded"
      - "F2K: entering ring 3"
      - "pong 0"
      - "ping 0"
      - "pong 1"
      - "ping 1"
      - "pong 2"
      - "ping 2"
      - "pong 3"
      - "ping 3"
      - "pong 4"
      - "ping 4"
      - "child handle wait returned 0"
      - "pingpong: ok"
      - "F2K: user process exited normally (exit code=0)"

  - name: pingpong-smoke-disk
    description: the blocking-wait smoke runs its captured five-turn alternation through two auto-reset events and a child thread, the child-handle wait returns 0, and the process exits cleanly (Limine disk path)
    image: disk
    features: [run-pingpong]
    # The strict alternation is the point: the turns must appear in order.
    ordered: true
    expects:
      - "F2K Booted Successfully"
      - "F2K: frame database audit: ok"
      - "F2K: kernel heap: alloc/free ok"
      - "F2K: image loaded"
      - "F2K: entering ring 3"
      - "pong 0"
      - "ping 0"
      - "pong 1"
      - "ping 1"
      - "pong 2"
      - "ping 2"
      - "pong 3"
      - "ping 3"
      - "pong 4"
      - "ping 4"
      - "child handle wait returned 0"
      - "pingpong: ok"
      - "F2K: user process exited normally (exit code=0)"

  # Timer smoke: the main
  # thread parks in the timer table through Sleep(200) (the idle
  # thread owns the processor while it sleeps), yields through
  # Sleep(0), and times out a wait on a never-signaled event after
  # 100 ms. Both spans read whole ticks: the GetTickCount reads and
  # the sleeps' due times derive from the same tick-quantized
  # accumulator, so the captured cadence (exactly 200 and exactly
  # 100) is pinned verbatim.
  - name: sleep-smoke
    description: the timer smoke parks the main thread in the timer table for a 200 ms sleep, yields through Sleep(0), and times out a 100 ms wait, reporting both spans at the captured cadence (kernel path)
    image: kernel
    features: [run-sleep]
    expects:
      - "F2K Booted Successfully"
      - "F2K: frame database audit: ok"
      - "F2K: kernel heap: alloc/free ok"
      - "F2K: image loaded"
      - "F2K: entering ring 3"
      - "sleep 200ms spanned 200 ticks"
      - "sleep 0 returned"
      - "timed wait: timeout after 100 ticks"
      - "sleep: ok"
      - "F2K: user process exited normally (exit code=0)"

  - name: sleep-smoke-disk
    description: the timer smoke parks the main thread in the timer table for a 200 ms sleep, yields through Sleep(0), and times out a 100 ms wait, reporting both spans at the captured cadence (Limine disk path)
    image: disk
    features: [run-sleep]
    expects:
      - "F2K Booted Successfully"
      - "F2K: frame database audit: ok"
      - "F2K: kernel heap: alloc/free ok"
      - "F2K: image loaded"
      - "F2K: entering ring 3"
      - "sleep 200ms spanned 200 ticks"
      - "sleep 0 returned"
      - "timed wait: timeout after 100 ticks"
      - "sleep: ok"
      - "F2K: user process exited normally (exit code=0)"

  # Preemption smoke: two
  # same-priority spinners alternate at quantum ends (round-robin
  # delivered from the tick — a quantum spans exactly two ticks),
  # and a third thread raised above them through SetThreadPriority
  # runs its whole block uninterrupted (the service-boundary
  # delivery), before the pair resumes and finishes. The capture is
  # shape-confirmed, not byte-exact: the per-run A/B progress line
  # counts are timing-dependent, so the case pins the invariants —
  # the C block's ten deterministic progress lines and completion as
  # one uninterrupted block (`contiguous`), the A/B/C completions with
  # their checksums, and the summary.
  - name: spin-smoke
    description: the preemption smoke interleaves two same-priority spinners at quantum ends and runs a raised thread's block uninterrupted, with all three checksums reported (kernel path)
    image: kernel
    features: [run-spin]
    # The raised thread's block runs uninterrupted: its progress lines
    # and completion appear on consecutive lines, no A/B line between.
    contiguous:
      - "C 5000000"
      - "C 10000000"
      - "C 15000000"
      - "C 20000000"
      - "C 25000000"
      - "C 30000000"
      - "C 35000000"
      - "C 40000000"
      - "C 45000000"
      - "C 50000000"
      - "C done, checksum 1283106752"
    expects:
      - "F2K Booted Successfully"
      - "F2K: frame database audit: ok"
      - "F2K: kernel heap: alloc/free ok"
      - "F2K: image loaded"
      - "F2K: entering ring 3"
      - "main: spinners started"
      - "main: starting high-priority thread"
      - "C done, checksum 1283106752"
      - "A done, checksum 1283106752"
      - "B done, checksum 1283106752"
      - "main: all threads finished"
      - "spin: ok"
      - "F2K: user process exited normally (exit code=0)"

  - name: spin-smoke-disk
    description: the preemption smoke interleaves two same-priority spinners at quantum ends and runs a raised thread's block uninterrupted, with all three checksums reported (Limine disk path)
    image: disk
    features: [run-spin]
    # The raised thread's block runs uninterrupted: its progress lines
    # and completion appear on consecutive lines, no A/B line between.
    contiguous:
      - "C 5000000"
      - "C 10000000"
      - "C 15000000"
      - "C 20000000"
      - "C 25000000"
      - "C 30000000"
      - "C 35000000"
      - "C 40000000"
      - "C 45000000"
      - "C 50000000"
      - "C done, checksum 1283106752"
    expects:
      - "F2K Booted Successfully"
      - "F2K: frame database audit: ok"
      - "F2K: kernel heap: alloc/free ok"
      - "F2K: image loaded"
      - "F2K: entering ring 3"
      - "main: spinners started"
      - "main: starting high-priority thread"
      - "C done, checksum 1283106752"
      - "A done, checksum 1283106752"
      - "B done, checksum 1283106752"
      - "main: all threads finished"
      - "spin: ok"
      - "F2K: user process exited normally (exit code=0)"

  # Thread-slot reuse smoke: the
  # main thread runs three rounds of create, wait for, close, one
  # child alive at a time, so every child after the first reuses
  # the gate-stack resources (the slot and its frames) the
  # previous one released at its exit — the kernel that keeps a
  # freed stack mapped fails the second round's spawn, and the one
  # that never releases fails the third (the slot ledger). The
  # child/main alternation is deterministic (main waits for each
  # child before creating the next), so the case pins the output
  # in order. Three rounds exactly fit the thread pool (three
  # records, never reclaimed); a fourth would refuse the create.
  - name: respawn-smoke
    description: the slot-reuse smoke runs three create/wait/close rounds, each child after the first reusing the previous one's released gate-stack resources, and exits cleanly (kernel path)
    image: kernel
    features: [run-respawn]
    # The create/wait/close rounds must appear in order.
    ordered: true
    expects:
      - "F2K Booted Successfully"
      - "F2K: frame database audit: ok"
      - "F2K: kernel heap: alloc/free ok"
      - "F2K: image loaded"
      - "F2K: entering ring 3"
      - "child 1: running"
      - "main: round 1: child finished"
      - "child 2: running"
      - "main: round 2: child finished"
      - "child 3: running"
      - "main: round 3: child finished"
      - "respawn: ok"
      - "F2K: user process exited normally (exit code=0)"

  - name: respawn-smoke-disk
    description: the slot-reuse smoke runs three create/wait/close rounds, each child after the first reusing the previous one's released gate-stack resources, and exits cleanly (Limine disk path)
    image: disk
    features: [run-respawn]
    # The create/wait/close rounds must appear in order.
    ordered: true
    expects:
      - "F2K Booted Successfully"
      - "F2K: frame database audit: ok"
      - "F2K: kernel heap: alloc/free ok"
      - "F2K: image loaded"
      - "F2K: entering ring 3"
      - "child 1: running"
      - "main: round 1: child finished"
      - "child 2: running"
      - "main: round 2: child finished"
      - "child 3: running"
      - "main: round 3: child finished"
      - "respawn: ok"
      - "F2K: user process exited normally (exit code=0)"

  # Multi-process suite: one boot
  # runs the sequence exit0, ret0, bsscheck, bsscheck, crash, exit0,
  # tearing each process down to the post-boot baseline before the
  # next starts. COM1 protocol, pinned here (the sequence runner
  # implements it; the shapes parallel the single-process lines with
  # the per-process index and name added):
  #   normal exit: F2K: process <i> (<name>) exited normally (exit code=N)
  #   fault:       F2K: process <i> (<name>) ended by fault (vector N)
  #   teardown:    F2K: process <i> teardown audit: frame database ok, kernel heap ok
  #   summary:     F2K: process suite complete: 6 run, 1 faulted, 0 leaks
  # The teardown line prints after every process (all six), so every
  # index is asserted independently; the crash fixture writes through
  # the unmapped NULL page, which raises #PF (vector 14).
  - name: process-suite
    description: sequential multi-process run (exit0, ret0, bsscheck x2, crash, exit0) with per-process teardown audits and a zero-leak summary (kernel path)
    image: kernel
    features: [run-process-suite]
    expects:
      - "F2K Booted Successfully"
      - "F2K: frame database audit: ok"
      - "F2K: kernel heap: alloc/free ok"
      - "F2K: process 1 (exit0) exited normally (exit code=0)"
      - "F2K: process 1 teardown audit: frame database ok, kernel heap ok"
      - "F2K: process 2 (ret0) exited normally (exit code=0)"
      - "F2K: process 2 teardown audit: frame database ok, kernel heap ok"
      - "F2K: process 3 (bsscheck) exited normally (exit code=0)"
      - "F2K: process 3 teardown audit: frame database ok, kernel heap ok"
      - "F2K: process 4 (bsscheck) exited normally (exit code=0)"
      - "F2K: process 4 teardown audit: frame database ok, kernel heap ok"
      - "F2K: process 5 (crash) ended by fault (vector 14)"
      - "F2K: process 5 teardown audit: frame database ok, kernel heap ok"
      - "F2K: process 6 (exit0) exited normally (exit code=0)"
      - "F2K: process 6 teardown audit: frame database ok, kernel heap ok"
      - "F2K: process suite complete: 6 run, 1 faulted, 0 leaks"

  - name: process-suite-disk
    description: sequential multi-process run (exit0, ret0, bsscheck x2, crash, exit0) with per-process teardown audits and a zero-leak summary (Limine disk path)
    image: disk
    features: [run-process-suite]
    expects:
      - "F2K Booted Successfully"
      - "F2K: frame database audit: ok"
      - "F2K: kernel heap: alloc/free ok"
      - "F2K: process 1 (exit0) exited normally (exit code=0)"
      - "F2K: process 1 teardown audit: frame database ok, kernel heap ok"
      - "F2K: process 2 (ret0) exited normally (exit code=0)"
      - "F2K: process 2 teardown audit: frame database ok, kernel heap ok"
      - "F2K: process 3 (bsscheck) exited normally (exit code=0)"
      - "F2K: process 3 teardown audit: frame database ok, kernel heap ok"
      - "F2K: process 4 (bsscheck) exited normally (exit code=0)"
      - "F2K: process 4 teardown audit: frame database ok, kernel heap ok"
      - "F2K: process 5 (crash) ended by fault (vector 14)"
      - "F2K: process 5 teardown audit: frame database ok, kernel heap ok"
      - "F2K: process 6 (exit0) exited normally (exit code=0)"
      - "F2K: process 6 teardown audit: frame database ok, kernel heap ok"
      - "F2K: process suite complete: 6 run, 1 faulted, 0 leaks"


  # Interrupt/timer core: the
  # irq-smoke diagnostic boot proves the hardware layer and the
  # interrupt core are live — the PIC remap to the 0x30-0x3F band, the
  # PIT programmed at the corpus-captured 10.0144 ms tick (divisor
  # 11949), the tick counter crossing its threshold, the DPC the
  # clock ISR enqueues, and the interrupt-core audit — and then the
  # normal boot proceeds to the default image's exit, proving the
  # tick and the process machinery coexist rather than just the
  # diagnostic running. The tick is default-on kernel machinery (not
  # a fixture selection); the feature gates only the diagnostic lines
  # and the bounded tick wait.
  - name: irq-smoke
    description: the interrupt diagnostic boot reports the PIC remap, the live tick, the clock DPC, and the audit, then the default image exits 0 (kernel path)
    image: kernel
    features: [irq-smoke]
    expects:
      - "F2K Booted Successfully"
      - "F2K: frame database audit: ok"
      - "F2K: kernel heap: alloc/free ok"
      - "F2K: irq-smoke: PIC remapped (master 0x30, slave 0x38, IRQ0 unmasked)"
      - "F2K: irq-smoke: PIT programmed (mode 3, divisor 11949, 10.0144 ms tick)"
      - "F2K: irq-smoke: timer live (>= 5 ticks observed)"
      - "F2K: irq-smoke: clock DPC fired"
      - "F2K: irq-smoke: interrupt audit: ok"
      - "F2K: image loaded"
      - "F2K: entering ring 3"
      - "F2K: user process exited normally (exit code=0)"

  - name: irq-smoke-disk
    description: the interrupt diagnostic boot reports the PIC remap, the live tick, the clock DPC, and the audit, then the default image exits 0 (Limine disk path)
    image: disk
    features: [irq-smoke]
    expects:
      - "F2K Booted Successfully"
      - "F2K: frame database audit: ok"
      - "F2K: kernel heap: alloc/free ok"
      - "F2K: irq-smoke: PIC remapped (master 0x30, slave 0x38, IRQ0 unmasked)"
      - "F2K: irq-smoke: PIT programmed (mode 3, divisor 11949, 10.0144 ms tick)"
      - "F2K: irq-smoke: timer live (>= 5 ticks observed)"
      - "F2K: irq-smoke: clock DPC fired"
      - "F2K: irq-smoke: interrupt audit: ok"
      - "F2K: image loaded"
      - "F2K: entering ring 3"
      - "F2K: user process exited normally (exit code=0)"

  # IDE driver: the disk-smoke diagnostic boot drives the IRQ14 PIO
  # read path end to end — IDENTIFY, the MBR, the volume boot sector,
  # and the first fixture's sector — then the default image exits 0:
  # coexistence, not just the diagnostic. The disk build copies
  # tests/hello/hello.exe into the volume first, so the fixture's bytes
  # land on cluster 3 (LBA 4067; see the disk target in the Makefile);
  # the expected checksums are the offline CRC-32s of its first 512 and
  # 4096 bytes, and one IRQ14 per sector is expected, none unsolicited.
  # The reads go through the block layer: the disk and the one partition
  # the boot-time scan registers from its MBR, the volume read as that
  # partition's own sectors. The scan's MBR read is the thirteenth
  # interrupt (IDENTIFY 1, scan 1, then 1 + 1 + 1 + 8).
  - name: disk-smoke
    description: the IDE diagnostic boot reads the MBR, the volume boot sector, and the first fixture's sectors through the block layer and IRQ14, then the default image exits 0 (Limine disk path)
    image: disk
    features: [disk-smoke]
    ordered: true
    expects:
      - "F2K Booted Successfully"
      - "F2K: ide: primary master: LBA28, 131072 sectors"
      - "F2K: disk-smoke: drive detected (LBA supported, 131072 sectors)"
      - "F2K: disk-smoke: block devices: 0 = ATA disk (131072 sectors of 512 bytes), 1 = partition 0 of device 0 (129024 sectors)"
      - "F2K: disk-smoke: MBR ok (signature 0xAA55, partition 0 type 0x0C at LBA 2048, 129024 sectors)"
      - "F2K: disk-smoke: volume boot sector ok (signature 0xAA55, 512 bytes/sector, 1 sector/cluster, 32 reserved, 2 FATs, 993 sectors/FAT, root cluster 2, data region at LBA 4066)"
      - "F2K: disk-smoke: LBA 4067 CRC-32 0x659C3505"
      - "F2K: disk-smoke: LBA 4067+8 CRC-32 0x15FB0DC0"
      - "F2K: disk-smoke: IRQ14 serviced 13 interrupts (0 unsolicited), interrupt audit: ok"
      - "F2K: image loaded"
      - "F2K: entering ring 3"
      - "F2K: user process exited normally (exit code=0)"
