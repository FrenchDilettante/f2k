# registry: one test per block of the real-machine capture (output.txt); see tests/README.md. It
# works under HKEY_CURRENT_USER\Software\F2K alone, deleting that tree at each pass's start and end.
description = "registry - the registry calls cmd.exe imports, W and A: RegCreateKeyEx and its dispositions, RegOpenKeyEx and RegOpenKey, RegCloseKey, RegSetValueEx and RegQueryValueEx over the value types and buffer sizes, RegSetValue and RegQueryValue's default values, RegEnumKey's order and buffers, RegDeleteKey and a deleted key's open handle, under HKCU\\Software\\F2K."
kind = "sectioned"
gate = true

[masks]
# A missing value's query leaves whatever advapi32 had at hand in the type: stack contents, not an
# answer.
queryvalue = [
    "RegQueryValueExW(\"missing\"), a missing value: ret=2 err=- type=* cb=1024 buffer=untouched",
    "RegQueryValueExW(\"missing\"), a missing value, NULL data: ret=2 err=- type=* cb=0 no buffer",
    "RegQueryValueExA(\"missing\"), a missing value: ret=2 err=- type=* cb=1024 buffer=untouched",
    "RegQueryValueExA(\"missing\"), a missing value, NULL data: ret=2 err=- type=* cb=0 no buffer",
]
delete = [
    "RegQueryValueExW(\"x\"), through the deleted key's handle: ret=1018 err=- type=* cb=1024 buffer=untouched",
    "RegQueryValueExW(\"x\"), the old handle, the name created anew with a value x: ret=1018 err=- type=* cb=1024 buffer=untouched",
    "RegQueryValueExA(\"x\"), through the deleted key's handle: ret=1018 err=- type=* cb=1024 buffer=untouched",
    "RegQueryValueExA(\"x\"), the old handle, the name created anew with a value x: ret=1018 err=- type=* cb=1024 buffer=untouched",
]

[pins]
# The exports each block pins, as dll.Export ("*": every block, what the C runtime's startup
# calls); scripts/compat.py derives each export's coverage from them. Every block deletes the F2K
# tree (RegOpenKeyExW, RegEnumKeyW, RegDeleteKeyW, RegCloseKey) and makes its keys
# (RegCreateKeyExW); HKEY_CURRENT_USER's first use in a block opens it (RtlOpenCurrentUser).
create = [
    "advapi32.RegCreateKeyExW",
    "advapi32.RegCreateKeyExA",
    "advapi32.RegOpenKeyExW",
    "advapi32.RegOpenKeyExA",
    "advapi32.RegEnumKeyW",
    "advapi32.RegDeleteKeyW",
    "advapi32.RegCloseKey",
    "ntdll.NtCreateKey",
    "ntdll.RtlOpenCurrentUser",
]
open = [
    "advapi32.RegOpenKeyExW",
    "advapi32.RegOpenKeyExA",
    "advapi32.RegOpenKeyW",
    "advapi32.RegOpenKeyA",
    "advapi32.RegCreateKeyExW",
    "advapi32.RegCreateKeyExA",
    "advapi32.RegSetValueExW",
    "advapi32.RegSetValueExA",
    "advapi32.RegQueryValueExW",
    "advapi32.RegEnumKeyW",
    "advapi32.RegDeleteKeyW",
    "advapi32.RegCloseKey",
    "ntdll.NtOpenKey",
]
close = [
    "advapi32.RegCloseKey",
    "advapi32.RegOpenKeyExW",
    "advapi32.RegOpenKeyExA",
    "advapi32.RegCreateKeyExW",
    "advapi32.RegEnumKeyW",
    "advapi32.RegDeleteKeyW",
    "ntdll.NtClose",
]
setvalue = [
    "advapi32.RegSetValueExW",
    "advapi32.RegSetValueExA",
    "advapi32.RegQueryValueExW",
    "advapi32.RegQueryValueExA",
    "advapi32.RegCreateKeyExW",
    "advapi32.RegOpenKeyExW",
    "advapi32.RegEnumKeyW",
    "advapi32.RegDeleteKeyW",
    "advapi32.RegCloseKey",
    "ntdll.NtSetValueKey",
