    "ntdll.RtlGetOwnerSecurityDescriptor",
    "ntdll.RtlSetOwnerSecurityDescriptor",
    "ntdll.RtlGetGroupSecurityDescriptor",
    "ntdll.RtlSetGroupSecurityDescriptor",
    "ntdll.RtlGetDaclSecurityDescriptor",
    "ntdll.RtlSetDaclSecurityDescriptor",
    "ntdll.RtlGetSaclSecurityDescriptor",
    "ntdll.RtlSetSaclSecurityDescriptor",
    "ntdll.RtlMakeSelfRelativeSD",
    "ntdll.RtlAbsoluteToSelfRelativeSD",
    "ntdll.RtlSelfRelativeToAbsoluteSD",
    "ntdll.RtlSelfRelativeToAbsoluteSD2",
    "kernel32.GetModuleHandleA",
