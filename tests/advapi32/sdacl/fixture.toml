# sdacl: one test per block of the real-machine capture (output.txt); see tests/README.md.
# Declared ahead of its real-machine files: tests\build.bat sdacl and tests\capture.bat sdacl
# land sdacl.exe and output.txt together on the VM trip; until then the suite skips the
# fixture (f2kboot.awaited).
description = "sdacl - security descriptors, ACLs and SIDs as advapi32 builds and inspects them: InitializeSecurityDescriptor with IsValidSecurityDescriptor, GetSecurityDescriptorLength and GetSecurityDescriptorControl (initsd); InitializeAcl, IsValidAcl, AddAce with GetAce readback, FindFirstFreeAce and DeleteAce (acl); AddAccessAllowedAce with the mask read back (allowedace); AddAccessDeniedAce and the ACE order (deniedace); AllocateAndInitializeSid, InitializeSid, GetLengthSid, IsValidSid, EqualSid, EqualPrefixSid, CopySid, ConvertSidToStringSidA/W, CreateWellKnownSid, FreeSid (sid); MakeSelfRelativeSD and the owner/group/DACL/SACL set/get round trips (selfrel); the trustee builders and queries A/W (trustee); the object and audit ACE builders (objace); the string SD conversions A/W (strsd); the private object security calls (privobj); SetSecurityDescriptorControl, the RM control, RtlCopySecurityDescriptor, BuildSecurityDescriptorA/W and the Convert*ToAccess* conversions (sdcorner); GetAuditedPermissionsFromAclA/W and SetEntriesInAuditListA/W (saclaudit); EqualDomainSid, the site and domain SID queries, IsWellKnownSid and the account lookups A/W (sidmore). The advapi32 security calls go through GetProcAddress, so the program loads where advapi32 lacks them."
kind = "sectioned"
gate = true

[pending]
# Every block waits for the behavior it pins; tests/capture.bat sdacl fills output.txt on the VM
# trip, and each block un-xfails when that behavior lands.
initsd = "advapi32's security-descriptor entry points carry no impl yet: InitializeSecurityDescriptor, IsValidSecurityDescriptor, GetSecurityDescriptorLength and GetSecurityDescriptorControl are catalogued only"
acl = "the ACL builders are unimplemented in advapi32: InitializeAcl, IsValidAcl, AddAce, GetAce, FindFirstFreeAce and DeleteAce are catalogued only"
allowedace = "AddAccessAllowedAce is unimplemented in advapi32 (catalogued only), so no allowed ACE is built or read back"
deniedace = "AddAccessDeniedAce is unimplemented in advapi32 (catalogued only), so no deny ACE is built and the walk order is unobserved"
sid = "the SID entry points are unimplemented in advapi32: AllocateAndInitializeSid's siblings InitializeSid, GetLengthSid, IsValidSid, EqualSid, EqualPrefixSid, CopySid, ConvertSidToStringSidA/W, CreateWellKnownSid and FreeSid beyond the implemented AllocateAndInitializeSid/EqualSid/FreeSid are catalogued only"
selfrel = "MakeSelfRelativeSD and the Get/SetSecurityDescriptorOwner/Group/Dacl/Sacl round trips are unimplemented in advapi32 (catalogued only)"
trustee = "the trustee builders and queries are unimplemented in advapi32 (catalogued only): BuildTrusteeWith*, BuildImpersonate* and GetTrustee* A/W never fill a trustee"
objace = "the object and audit ACE builders are unimplemented in advapi32 (catalogued only): AddAccessAllowedObjectAce, AddAccessDeniedObjectAce, AddAuditAccessAce(Ex), AddAuditAccessObjectAce and the AceEx forms never add an ACE"
strsd = "the string security descriptor conversions are unimplemented in advapi32 (catalogued only): ConvertSecurityDescriptorToStringSecurityDescriptorA/W and ConvertStringSecurityDescriptorToSecurityDescriptorA/W never convert"
privobj = "the private object security calls are unimplemented in advapi32 (catalogued only): CreatePrivateObjectSecurity(Ex), DestroyPrivateObjectSecurity, Get/SetPrivateObjectSecurity(Ex) and ConvertToAutoInheritPrivateObjectSecurity never run"
sdcorner = "the SD corner calls are unimplemented in advapi32/ntdll (catalogued only): SetSecurityDescriptorControl, the RM control pair, BuildSecurityDescriptorA/W, the Convert*ToAccess* conversions and ntdll's RtlCopySecurityDescriptor never run"
saclaudit = "GetAuditedPermissionsFromAclA/W and SetEntriesInAuditListA/W are unimplemented in advapi32 (catalogued only), so no audit list is queried or built"
sidmore = "the remaining SID calls are unimplemented in advapi32 (catalogued only): EqualDomainSid, GetWindowsAccountDomainSid, GetSiteSidFromToken, GetMangledSiteSid, IsWellKnownSid and the LookupAccountName/Sid A/W pair never answer"

