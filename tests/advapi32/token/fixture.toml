# token: one test per block of the real-machine capture (output.txt); see tests/README.md. Built
# with /MD. Captured on an administrator account. A token's privileges vary with the account and the
# machine's policy, so the fixture prints only SeShutdownPrivilege's, SeChangeNotifyPrivilege's and
# SeTcbPrivilege's, by their public LUIDs, and the list's size as relations; the computer's name
# never prints (a lookup on it prints whether its LUID is the NULL case's). SeShutdownPrivilege is
# enabled only to observe the calls that enable it, and disabled again before the section does
# anything but adjust or query the token.
description = "token - the process token as a program that shuts the machine down prepares it, then as programs inspect it: OpenProcessToken with TOKEN_QUERY and TOKEN_ADJUST_PRIVILEGES (the handle's type and granted access, CloseHandle) and its errors; LookupPrivilegeValueA/W for SeShutdownPrivilege, SeChangeNotifyPrivilege and SeDebugPrivilege (their LUIDs), an unknown or empty name, NULL pointers, and an empty or the local computer's system name; AdjustTokenPrivileges enabling and disabling SeShutdownPrivilege (the return, the error, PreviousState and ReturnLength), PreviousState too short, DisableAllPrivileges and its restore, a privilege the token does not hold (ERROR_NOT_ALL_ASSIGNED); GetTokenInformation(TokenPrivileges) and its sizes; ntdll's NtOpenProcessToken and NtAdjustPrivilegesToken; GetTokenInformation class by class (sizes, a buffer a byte short), the SIDs by what they are, the default DACL, source, type, statistics; CheckTokenMembership and the groups scan; SeSystemtimePrivilege, SeBackupPrivilege, SeShutdownPrivilege and SeDebugPrivilege enabled and put back."
kind = "sectioned"
gate = true

[pending]
admin = "F2K's advapi32 has no CheckTokenMembership, AllocateAndInitializeSid, EqualSid or FreeSid"
privs = "F2K's tokens hold three privileges (SeChangeNotifyPrivilege, SeShutdownPrivilege and SeLoadDriverPrivilege), so enabling SeSystemtimePrivilege, SeBackupPrivilege or SeDebugPrivilege answers ERROR_NOT_ALL_ASSIGNED"

[pins]
# The exports each block pins, as dll.Export; scripts/compat.py derives each export's coverage from
# them. Only what a section calls itself and observes.
open = [
    "advapi32.OpenProcessToken",
    "kernel32.GetCurrentProcess",
    "kernel32.OpenProcess",
    "kernel32.CloseHandle",
    "ntdll.NtQueryObject",
]
openerr = [
    "advapi32.OpenProcessToken",
    "kernel32.GetCurrentProcess",
    "kernel32.GetCurrentThread",
    "kernel32.OpenProcess",
]
lookup = [
    "advapi32.LookupPrivilegeValueA",
    "advapi32.LookupPrivilegeValueW",
]
adjust = [
    "advapi32.OpenProcessToken",
    "advapi32.AdjustTokenPrivileges",
    "advapi32.GetTokenInformation",
]
prevshort = [
    "advapi32.OpenProcessToken",
    "advapi32.AdjustTokenPrivileges",
    "advapi32.GetTokenInformation",
]
disableall = [
