# batflow: one test, the script's one block (`cmd /c batflow.cmd`, output.txt); see tests/README.md,
# "Script fixtures".
# The mask: for /f over a file that does not exist, Windows 2000's cmd.exe reports it twice, the
# first time with what its memory held for the name (the capture's bytes "?\x13?\x13"), then with
# the name. F2K prints "??" there; the mask matches only a name that starts with a "?", so the
# second report's name is still compared.
description = "batflow - the control flow tests/core/test_cmd_flow.py checks by hand, captured: goto ahead and back, call :label with arguments, shift and exit /b, call in a for loop, for /l, for /f over a string and a command, %~nx and %~x, if exist and if not exist with else and blocks over several lines, nested if /i and GTR, if defined, if errorlevel and if cmdextversion, for at cmd /c's rules, and a chain of 40 batch files run without call; for over wildcards (none matching, no wildcard, two patterns), for /d, for /r with and without a wildcard, for /f over a file (skip=, eol=, tokens=, usebackq over a quoted name, a command and a string, a file that does not exist), goto and call to a label that does not exist, call :label outside a batch file, and echo ) in and out of blocks."
kind = "script"
gate = true
timeout = 60
masks = ["The system cannot find the file ?*."]
