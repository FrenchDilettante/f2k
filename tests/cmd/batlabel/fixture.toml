# batlabel: one test, the script's one block (`cmd /c batlabel.cmd`, output.txt); see tests/README.md,
# "Script fixtures".
# Captured on the 2026-11-27 VM trip (shallow-gui-cmd finding 26): batedge's long labels each met a goto
# before them or a label of 140 characters on their scan, so they do not tell how Windows 2000's
# cmd.exe reads a label past 128 characters. Each case here is a batch file of its own.
description = "batlabel - goto and call to labels around 128 characters, each case in a batch file and a cmd.exe of its own: a label of 128 characters, one of 129 by its whole name and by its first 128, a name of 140 characters whose first 128 are a label's, a short label after a label of 140 characters, a label of 40 characters by its first 39, call of a label of 129 characters."
kind = "script"
gate = true
timeout = 60
pending = "Windows 2000's cmd.exe finds no label of 128 characters or more (a goto or call to one fails, its message cut at 128, and the script ends with -1, a goto past a 140-character label too); F2K's cmd.exe reaches such labels, ends a missing label's goto with 1, and returns from a failed call"
