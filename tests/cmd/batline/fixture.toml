# batline: one test, the script's one block (`cmd /c batline.cmd`, output.txt); see tests/README.md,
# "Script fixtures". It runs spawnkid.exe, the spawn fixture's companion: beside the script in
# \CORPUS on F2K, copied beside it by capture.bat on the real machine.
description = "batline - how a line is read: where a command word ends (cd.. cd\\ cd/, echo run into each of its separators, a tab after echo and after a program's name, a program's name run into a comma, a semicolon and an equals sign), leading at signs, echo ON and OFF with blanks around the word, quoted command words, a directory's name typed as a command, the prompt a line is echoed after (an unknown dollar code, a dollar at its end, a prompt over 511 characters by its echoed size), and lines of 2046 to 2048 characters after expansion in a batch file and as a cmd /c string."
kind = "script"
gate = true
# Its boot takes about 25 s on the opt-0 kernel, past the default budget.
timeout = 40
masks = ["* was unexpected at this time."]
