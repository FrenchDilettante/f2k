# crt: one test per block of the real-machine capture (output.txt); see tests/README.md. Built with
# /MD, so it imports the C runtime from msvcrt.dll as cmd.exe does. Its args block runs with its own
# command line (tests/capture.bat).
description = "crt - msvcrt.dll's startup and exit protocol under /MD (crt.c): argv and envp as __getmainargs builds them, _fmode, _commode and _controlfp, the .CRT$XIU/.CRT$XCU initializers _initterm runs, and the exit paths: atexit and exit, _exit, main's return, and an unhandled exception through _XcptFilter."
kind = "sectioned"
gate = true

[pins]
# The exports each block pins, as dll.Export ("*": every block, what the C runtime's startup
# calls); scripts/compat.py derives each export's coverage from them.
"*" = [
    "msvcrt.__set_app_type",
    "msvcrt.__p__fmode",
    "msvcrt.__p__commode",
    "msvcrt._controlfp",
    "msvcrt.__setusermatherr",
    "msvcrt._initterm",
    "msvcrt.__getmainargs",
    "msvcrt.__p___initenv",
    "msvcrt.exit",
    "msvcrt._vsnprintf",
    "msvcrt.strcmp",
    "msvcrt._stricmp",
]
args = ["msvcrt.__getmainargs", "msvcrt.__p___argc", "msvcrt.__p___argv"]
env = [
    "msvcrt.__getmainargs",
    "msvcrt.__p__environ",
    "msvcrt.__p___initenv",
    "kernel32.GetEnvironmentStrings",
    "kernel32.FreeEnvironmentStringsA",
]
modes = ["msvcrt.__p__fmode", "msvcrt.__p__commode", "msvcrt._controlfp"]
init = ["msvcrt._initterm", "msvcrt.__p___argc", "msvcrt.sprintf"]
exit = ["msvcrt.exit", "msvcrt._onexit", "msvcrt.setvbuf", "msvcrt.printf", "msvcrt._iob"]
_exit = ["msvcrt._exit", "msvcrt._onexit", "msvcrt.setvbuf", "msvcrt.printf", "msvcrt._iob"]
return = ["msvcrt.exit", "msvcrt._onexit"]
unhandled = ["msvcrt._XcptFilter", "kernel32.SetErrorMode", "kernel32.UnhandledExceptionFilter"]
