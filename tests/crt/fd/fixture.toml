# fd: one test per block of the real-machine capture (output.txt); see tests/README.md. Built with
# /MD, so it imports the C runtime from msvcrt.dll as cmd.exe does. Works in a SCRATCH directory
# beside the program, which each section empties first.
description = "fd - msvcrt.dll's descriptor layer and stdio under /MD (fd.c): _open_osfhandle and _get_osfhandle, _dup and _dup2 (fd 1 redirected into a file and restored), _close, _setmode's text and binary modes and _tell, _iob's streams with fprintf, printf and fflush, fgets in text and binary mode, fread, fwrite, fseek, ftell and clearerr in text and binary mode, fgetws and fputws, _getch over queued console key events; Ctrl-Z, \"a+\" and ftell in text mode, fopen's mode strings and _O_TEMPORARY, 40 streams at once with _flushall and _fcloseall, and fgets over console lines holding Ctrl-Z."
kind = "sectioned"
gate = true

[pending]
nfiles = "F2K's msvcrt keeps its streams in _iob's 20 entries (its 18th fopen fails with EMFILE, where msvcrt 6 grows __piob to 512) and exports no _flushall or _fcloseall"
conctrlz = "F2K's _read keeps a Ctrl-Z read from a device as data, and its console ReadFile does not answer a line starting with Ctrl-Z with 0 bytes"


[pins]
