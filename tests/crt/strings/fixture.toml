# strings: one test per block of the real-machine capture (output.txt); see tests/README.md. Built
# with /MD, so it imports the C runtime from msvcrt.dll as cmd.exe does.
description = "strings - msvcrt.dll's number conversions, searches, path splitting and wide formatting under /MD (strings.c): _itow, _ltow and _ultow, _wtoi and atol, abs and labs, strstr, wcspbrk and wcscspn, _wcsdup, _wcsrev and _strcmpi, _splitpath and _wsplitpath, vswprintf, wprintf and fwprintf."
kind = "sectioned"
gate = true

[pins]
# The exports each block pins, as dll.Export ("*": every block, what the C runtime's startup
# calls); scripts/compat.py derives each export's coverage from them.
"*" = [
    "msvcrt.__set_app_type",
    "msvcrt.__p__fmode",
    "msvcrt.__p__commode",
    "msvcrt._controlfp",
    "msvcrt.__setusermatherr",
    "msvcrt._initterm",
    "msvcrt.__getmainargs",
    "msvcrt.__p___initenv",
    "msvcrt.exit",
    "msvcrt._vsnprintf",
    "msvcrt.strcmp",
    "msvcrt._stricmp",
]
itow = ["msvcrt._itow", "msvcrt._ltow", "msvcrt._ultow"]
atoi = ["msvcrt._wtoi", "msvcrt.atol"]
abs = ["msvcrt.abs", "msvcrt.labs"]
search = ["msvcrt.strstr", "msvcrt.wcspbrk", "msvcrt.wcscspn"]
dupcase = ["msvcrt._wcsdup", "msvcrt._wcsrev", "msvcrt._strcmpi"]
split = ["msvcrt._splitpath", "msvcrt._wsplitpath"]
wformat = ["msvcrt.vswprintf", "msvcrt.wprintf", "msvcrt.fwprintf"]
