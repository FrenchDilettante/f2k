# fswrite: one test per block of the real-machine capture (output.txt); see tests/README.md. The dirs
# block's hundred files take about twenty seconds in the unoptimized kernel, hence the longer timeout.
description = "fswrite - the write side of the file API (fswrite.c): create dispositions, writes and truncation, share modes, rename, copy and delete, directories, file times, and CRT writes, in a scratch directory."
kind = "sectioned"
gate = true
timeout = 40

# The blocks this kernel does not pass yet, each with the increment that enables it.
[pending]
create = "B9: files, the FAT32 write side"
write = "B9: files, the FAT32 write side"
share = "B9: files, the FAT32 write side"
names = "B9: files, the FAT32 write side"
dirs = "B9: files, the FAT32 write side"
times = "B9: files, the FAT32 write side"
crt = "B9: files, the FAT32 write side"
