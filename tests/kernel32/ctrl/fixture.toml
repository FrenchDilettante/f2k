[keys]
# The keys block's keys, as a person presses them on the real machine once each step's prompt
# shows (ctrl.c's header lists them; each step's marker line is the block's own output). A read's
# Ctrl+C or Ctrl+Break comes once the read has echoed "abc" (the screen's last line), so the read
# waits for its line when the key arrives; it is held until the block has counted the input events
# left, as a person's hand is still on the keys then.
keys = [
    { after = "step 1: type abc, then press Ctrl+C", press = ["a", "b", "c"] },
    { screen = "abc", hold = "ctrl-c" },
    { after = "input events left: 0" },
    { after = "step 2: type abc, then press Ctrl+C", press = ["a", "b", "c"] },
    { screen = "abc", hold = "ctrl-c" },
    { after = "input events left: 0" },
    { after = "step 3: type abc, then press Ctrl+Break", press = ["a", "b", "c"] },
    { screen = "abc", hold = "ctrl-pause" },
    { after = "input events left: 0" },
    { after = "step 4: press Ctrl+C", press = ["ctrl-c"] },
    { after = "step 5: press Ctrl+Break", press = ["ctrl-pause"] },
]
