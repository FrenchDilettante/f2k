# dll: one test per block of the real-machine capture (output.txt); see tests/README.md. Its
# companion DLL (f2kcom.dll, built beside dll.exe from f2kcom.c and f2kcom.def, with no C runtime
# and no entry point: nothing runs at load time) goes beside dll.exe in \CORPUS, as it sits beside
# the program on the real machine.
description = "dll - a program and its companion DLL: LoadLibraryA of the DLL from the program's directory, GetProcAddress by name and by ordinal, a call into it, and FreeLibrary."
kind = "sectioned"
gate = true

[pins]
# The exports each block pins, as dll.Export ("*": every block, what the C runtime's startup
# calls); scripts/compat.py derives each export's coverage from them.
proc = ["kernel32.GetProcAddress", "ntdll.LdrGetProcedureAddress"]
