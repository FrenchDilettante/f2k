# files: one test per block of the real-machine capture (output.txt); see tests/README.md. The read
# block's five thousand small reads take about twenty seconds in the unoptimized kernel, each through
# kernel32's ReadFile and NtReadFile, hence the longer timeout.
description = "files - the read side of the file API over files/DATA (files.c): path forms and errors, chunked and boundary reads, seeks, metadata, FindFirstFile listings, share modes, CRT file I/O, read-only file mappings, concurrent readers, which freed handle slot an open takes, handle flags (GetHandleInformation, SetHandleInformation, NtQueryObject), a duplicated handle's shared position while another thread reads, and image sections outliving their file's handle. Captured on a local FAT32 volume, as F2K's boot volume is."
kind = "sectioned"
gate = true
timeout = 40

[pins]
# The exports each block pins, as dll.Export ("*": every block, what the C runtime's startup
# calls); scripts/compat.py derives each export's coverage from them.
