# fswrite: one test per block of the real-machine capture (output.txt); see tests/README.md. The dirs
# block's hundred files take about twenty seconds in the unoptimized kernel, hence the longer timeout.
description = "fswrite - the write side of the file API (fswrite.c): create dispositions, writes and truncation, share modes, rename, copy and delete, directories, file times, CRT writes, and LockFile/UnlockFile between two handles (the I/O a lock refuses, unlocks of ranges never locked), MoveFileEx's refusals that leave both names (moveinto), truncating opens against another handle's sharing (overwrite), overlapped file I/O (overlap), negative OVERLAPPED offsets (negoff), a tree past MAX_PATH through \\\\?\\ (deep), and opens for writing of a file mapped as an image (imagewrite), in a scratch directory."
kind = "sectioned"
gate = true
timeout = 40

[pending]
imagewrite = "once the image's views are unmapped and its section closed, CreateFileA(GENERIC_READ | GENERIC_WRITE) of the file panics the kernel (kernel/src/fs/file.rs: an open names a live record), where Windows 2000 opens it and the next image mapping sees the write"

