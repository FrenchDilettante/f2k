# lineedit: one test per block of the real-machine capture (output.txt); see tests/README.md. Built
# with /MD. Every section works through CONIN$ and CONOUT$ opened by name and reads only key events it
# queued itself, ending with Enter (a watchdog queues Esc and Enter should a read still wait), so
# capture.bat takes every block. Each block's screen is saved as its process ends (screenshots), for
# the record.
description = "lineedit - the console's line editing and history in a line-mode read with echo (lineedit.c), over key events queued with WriteConsoleInputW/A and read with ReadConsoleW/A: Left, Right, Home, End, Ctrl+Left/Right, Delete, Backspace, Esc, Insert and ENABLE_INSERT_MODE, lines longer than a row and on the buffer's last row, Up, Down, PgUp, PgDn, F1, F3, F5, F6, F8 and Alt+F7; each read's result and the echoed rows read back."
kind = "sectioned"
screenshots = true

[pins]
# The exports each block pins, as dll.Export; scripts/compat.py derives each export's coverage from
# them. Every section makes the same calls: the screen cleared (FillConsoleOutputCharacterW,
# FillConsoleOutputAttribute, SetConsoleCursorPosition), the input mode set and restored, key events
# queued and read through both widths, the echo read back, and the watchdog's thread.
plain = [
    "kernel32.CreateFileA",
    "kernel32.GetConsoleScreenBufferInfo",
    "kernel32.FillConsoleOutputCharacterW",
    "kernel32.FillConsoleOutputAttribute",
    "kernel32.SetConsoleCursorPosition",
    "kernel32.GetConsoleMode",
    "kernel32.SetConsoleMode",
    "kernel32.FlushConsoleInputBuffer",
    "kernel32.WriteConsoleInputW",
    "kernel32.WriteConsoleInputA",
    "kernel32.ReadConsoleW",
    "kernel32.ReadConsoleA",
    "kernel32.ReadConsoleOutputCharacterW",
    "kernel32.CreateThread",
]
