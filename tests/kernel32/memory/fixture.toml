# memory: one test per block of the real-machine capture (output.txt); see tests/README.md.
description = "memory - allocation, address space, and stacks (memory.c): the C runtime heap the way programs use it, the Win32 heaps, Local/Global memory, the virtual memory API and its protections, the image's own sections, paging-file mappings, stacks, NtQuerySection, a console call writing into a thread's stack guard page, and GlobalFlags over the GMEM_ blocks."
kind = "sectioned"
gate = true
[masks]
# Free regions run to the next allocation, wherever the system put it.
virtual = ["released: state 0x10000 protect 0x1 type 0x0 region * allocprotect 0x0"]
image = ["past the image end: state 0x10000 protect 0x1 type 0x0 region * allocprotect 0x0"]

# The blocks this kernel does not pass yet, each with the increment that enables it.
[pending]

[pins]
# The exports each block pins, as dll.Export; scripts/compat.py derives each export's coverage from
# them. Only what a section calls itself, through its own helpers too, never what the C runtime's
# startup calls.
image = [
    "kernel32.GetModuleHandleA",
    "kernel32.GetModuleHandleW",
    "kernel32.GetLastError",
    "kernel32.SetLastError",
    "kernel32.VirtualQuery",
    "ntdll.NtQueryVirtualMemory",
    "ntdll.LdrGetDllHandle",
]
mapping = [
    "kernel32.CloseHandle",
    "kernel32.GetLastError",
    "kernel32.SetLastError",
    "kernel32.CreateFileMappingA",
    "kernel32.CreateFileMappingW",
    "kernel32.OpenFileMappingA",
    "kernel32.OpenFileMappingW",
    "kernel32.MapViewOfFile",
    "kernel32.UnmapViewOfFile",
    "kernel32.VirtualQuery",
    "ntdll.NtQueryVirtualMemory",
    "ntdll.NtCreateSection",
    "ntdll.NtOpenSection",
    "ntdll.NtMapViewOfSection",
    "ntdll.NtUnmapViewOfSection",
]
stack = [
    "kernel32.CloseHandle",
    "kernel32.GetLastError",
    "kernel32.CreateThread",
    "kernel32.WaitForSingleObject",
    "kernel32.VirtualQuery",
    "ntdll.NtQueryVirtualMemory",
    "ntdll.NtCreateThread",
]
