# ntquery: one test per block of the real-machine capture (output.txt); see tests/README.md.
description = "ntquery - the introspection surface called ntdll-direct through GetProcAddress: NtQuerySystemInformation class 5 (sysinfo), NtQueryInformationProcess class 0 with the PEB address (procinfo), NtQueryInformationThread class 0 with its fields as relations and the exact length it requires (threadinfo), ReadProcessMemory of the section's own PEB with its first fields as relations (pebread), OpenSCManagerA (scmfail), and NtQuerySystemInformation class 5 with 60 children alive (this program again, run as its own child): the short buffer's status and the length it reports, then the listing, the children found in it as counts (children)."
kind = "sectioned"
gate = true
timeout = 60

[pending]
scmfail = "F2K runs no service control manager (services.exe and its RPC interface): advapi32's OpenSCManagerA is a stub failing with ERROR_CALL_NOT_IMPLEMENTED, where Windows 2000 answers a handle, its last error the RPC transport's leftover ERROR_IO_PENDING"

[pins]
sysinfo = [
    "ntdll.NtQuerySystemInformation",
]
procinfo = [
    "ntdll.NtQueryInformationProcess",
]
threadinfo = [
    "ntdll.NtQueryInformationThread",
    "kernel32.GetCurrentProcessId",
    "kernel32.GetCurrentThreadId",
]
pebread = [
    "ntdll.NtQueryInformationProcess",
    "kernel32.ReadProcessMemory",
    "kernel32.GetModuleHandleA",
    "kernel32.GetProcessHeap",
]
scmfail = [
    "advapi32.OpenSCManagerA",
]
children = [
    "ntdll.NtQuerySystemInformation",
    "kernel32.CreateProcessA",
    "kernel32.GetCurrentProcessId",
    "kernel32.GetExitCodeProcess",
]
