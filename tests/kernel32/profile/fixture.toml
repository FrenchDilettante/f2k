# profile: one test per block of the real-machine capture (output.txt); see tests/README.md. Its
# private file, profile.ini (CRLF), sits beside the program on the real machine and goes into
# \CORPUS beside it for F2K's boot (data_files); the program only reads it, and writes only to the
# scratch files it deletes at each section's start and end (profwork.ini, its copy, and
# profnew.ini and profneww.ini). win.ini is touched only in its [F2KProfile] section, removed at
# each section's start and end. No path prints.
description = "profile - kernel32's profile functions: GetProfileIntA/W, GetProfileStringA/W and WriteProfileStringA/W on win.ini's [F2KProfile] (defaults, values written and read back as numbers and strings, short buffers, the key list, a key and the section deleted, the section names as F2KProfile among them or not); GetPrivateProfileStringA/W, GetPrivateProfileIntA/W, GetPrivateProfileSectionA/W and GetPrivateProfileSectionNamesA/W over the fixture's own profile.ini (comments, blanks, quotes, numbers, repeated keys and sections, short buffers, lists, a missing file); WritePrivateProfileStringA/W and WritePrivateProfileSectionA/W on a copy and on new files, and the bytes they leave."
kind = "sectioned"
data_files = ["profile.ini"]
gate = true

[pending]
winini = "the disk carries no \\WINNT\\win.ini: win.ini's section list is empty before [F2KProfile] is written and after it is deleted"

[pins]
# The exports each block pins, as dll.Export; scripts/compat.py derives each export's coverage from
# them. Only the profile functions a section observes, not the file calls around them (CopyFileA,
# CreateFileA, ReadFile, DeleteFileA, GetModuleFileNameA/W).
winini = [
    "kernel32.GetProfileIntW",
    "kernel32.GetProfileIntA",
    "kernel32.GetProfileStringW",
    "kernel32.GetProfileStringA",
    "kernel32.WriteProfileStringW",
    "kernel32.WriteProfileStringA",
]
read = ["kernel32.GetPrivateProfileStringA", "kernel32.GetPrivateProfileStringW"]
int = ["kernel32.GetPrivateProfileIntA", "kernel32.GetPrivateProfileIntW"]
sections = [
    "kernel32.GetPrivateProfileSectionA",
    "kernel32.GetPrivateProfileSectionW",
    "kernel32.GetPrivateProfileSectionNamesA",
    "kernel32.GetPrivateProfileSectionNamesW",
]
write = [
    "kernel32.WritePrivateProfileStringA",
    "kernel32.WritePrivateProfileStringW",
    "kernel32.WritePrivateProfileSectionA",
    "kernel32.WritePrivateProfileSectionW",
]
new = [
    "kernel32.WritePrivateProfileStringA",
    "kernel32.WritePrivateProfileStringW",
    "kernel32.GetPrivateProfileStringA",
    "kernel32.GetPrivateProfileStringW",
]
