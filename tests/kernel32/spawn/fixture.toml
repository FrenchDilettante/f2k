# spawn: one test per block of the real-machine capture (output.txt); see tests/README.md. Built with
# /MD. Its companion program, spawnkid.exe (built beside spawn.exe from spawnkid.c, with /MD), is the
# child every section starts; it goes into \CORPUS beside the program, as it sits beside it on the
# real machine. Gated. The system block (no cmd.exe on F2K's disk) and the detach block (F2K's stub
# path) are expected to stay pending. The create block starts some sixty processes, hence the
# longer timeout.
description = "spawn - child processes (spawn.c, with its companion program spawnkid.c): Windows 2000's fixed addresses of the TEB, PEB and their fields in the parent, a second thread and a child; CreateProcessA/W's names, search order, quoting and errors; waits and exit codes; process and thread handles, OpenProcess, CREATE_SUSPENDED, TerminateProcess and DuplicateHandle into a child; inherited standard handles; environment blocks and the current directory; ReadProcessMemory and WriteProcessMemory; GetBinaryTypeA/W, on programs and on made-up headers; an ended process, a child never started, DUPLICATE_CLOSE_SOURCE, another process's memory (VirtualAllocEx and the rest, FlushInstructionCache), handle flags in a child; msvcrt's descriptor block for a child, its _spawn family, _cwait, _P_OVERLAY, system(); DETACHED_PROCESS, CREATE_NEW_CONSOLE and _P_DETACH; a child terminated twice, a process's exit code when its threads end it in turn, racing terminations, CreateRemoteThread into an exiting child, and NtCreateProcess with no thread."
kind = "sectioned"
gate = true
timeout = 60

[pending]
system = "no cmd.exe on F2K's disk"
detach = "F2K's stub path (logged, error 120)"

[masks]
# The command line's buffer follows the process parameters' strings before it (the current
# directory, the program's path), whose lengths depend on where the fixture sits. A second thread's
# stack lands wherever the address space has room for its reservation when the thread is made,
# which follows what the program and its DLLs reserved before it.
layout = [
    "parent: environment 0x00010000, command line buffer *",
    "second thread: stack base *, limit *",
    "child: environment 0x00010000, command line buffer *",
]
# Whether a CreateRemoteThread lands in the child's last moments, and is refused, depends on timing:
# one capture saw refusals other than ERROR_ACCESS_DENIED, the next none.
remoteexit = ["its refusals while it exited: *"]

[pins]
# The exports each block pins, as dll.Export; scripts/compat.py derives each export's coverage from
# them. Only what a section calls itself: never the C runtime's startup, nor what a library calls
# underneath (_spawnl pins msvcrt._spawnl, not the CreateProcessA beneath it).
layout = [
    "kernel32.CreateThread",
    "kernel32.CreateProcessA",
    "ntdll.NtQueryInformationProcess",
    "ntdll.NtQueryInformationThread",
    "kernel32.ReadProcessMemory",
    "kernel32.GetExitCodeProcess",
]
create = [
    "kernel32.CreateProcessA",
    "kernel32.CreateProcessW",
    "kernel32.WaitForSingleObject",
    "kernel32.GetExitCodeProcess",
    "kernel32.SetCurrentDirectoryA",
    "kernel32.SetEnvironmentVariableA",
]
wait = [
