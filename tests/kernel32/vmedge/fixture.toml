# vmedge: one test per block of the real-machine capture (output.txt); see tests/README.md.
description = "vmedge - the virtual-memory and sections corners: a thread of its own walking its stack down to STATUS_STACK_OVERFLOW, counting the guard-page exceptions it sees and surveying its reservation before and after (guardwalk), MEM_COMMIT over a mapped view succeeding over a paging-file-backed section and failing with ERROR_ACCESS_DENIED over a file-backed one (commitview), and NtUnmapViewOfSection of a private region and of a suspended copy's image, through an address inside the view, and again (unmapimage)."
kind = "sectioned"
gate = true

[pins]
guardwalk = [
    "kernel32.CreateThread",
    "kernel32.WaitForSingleObject",
    "kernel32.VirtualQuery",
]
commitview = [
    "kernel32.VirtualAlloc",
    "kernel32.CreateFileMappingA",
    "kernel32.MapViewOfFile",
    "kernel32.CreateFileA",
]
unmapimage = [
    "ntdll.NtUnmapViewOfSection",
    "kernel32.CreateProcessA",
    "kernel32.VirtualQueryEx",
    "kernel32.TerminateProcess",
    "kernel32.WaitForSingleObject",
]
