# coords: one test per block of the real-machine capture (output.txt); see tests/README.md. Its
# windows are hidden but for childpt's parent, at fixed screen positions, so their coordinates print
# as they are; a framed or captioned window's client area prints only less its metrics. No handle
# or address prints: a window prints by its label, a character pointer as its offset. adjust,
# frames, nccalc and nchittest are the non-client area: they print the frame metrics and sizes in
# pixels, as the capture machine's standard scheme at 96 DPI gives them.
description = "coords - window coordinates: GetClientRect and GetWindowRect (a borderless popup and its children, a bordered and a captioned window less their metrics), MapWindowPoints between children, parents, the screen and a window itself (the points and the return's halves), ScreenToClient and ClientToScreen, ChildWindowFromPoint and ChildWindowFromPointEx (CWP_ALL, CWP_SKIPINVISIBLE, CWP_SKIPDISABLED) over visible, hidden and disabled children and a grandchild, IsChild, OffsetRect, and CharNextA/W and CharPrevA/W walks over plain text, the empty string, combining marks and a surrogate pair. Then the non-client area: the frame, edge, caption, menu and caption-button metrics (GetSystemMetrics), AdjustWindowRect and AdjustWindowRectEx for fifteen frame styles with and without a menu, each style's window and client sizes and client origin against AdjustWindowRectEx, the default window procedure's WM_NCCALCSIZE (a rectangle, and NCCALCSIZE_PARAMS), and its WM_NCHITTEST codes along rows and columns across shown windows of five styles."
kind = "sectioned"
gate = true

[pending]
adjust = "F2K's sizing frame is SM_CXFRAME wide on a window without WS_BORDER (4 pixels), where Windows 2000 takes the border's pixel off it (3), in AdjustWindowRectEx as in the window"
frames = "user32 has no EqualRect yet; F2K's sizing frame is 4 pixels on a window without WS_BORDER, where Windows 2000's is 3; and F2K takes no scroll bars off the client area"
nchittest = "F2K's WM_NCHITTEST answers HTCAPTION in the 2-pixel gaps beside the caption buttons, where Windows 2000 gives each button its whole SM_CXSIZE cell"

[pins]
# The exports each block pins, as dll.Export; scripts/compat.py derives each export's coverage from
# them. Only the exports a section observes, not the helpers it calls around them (the windows'
# creation and destruction, ShowWindow).
client = [
    "user32.GetClientRect",
    "user32.GetWindowRect",
    "user32.ClientToScreen",
    "user32.GetSystemMetrics",
]
map = ["user32.MapWindowPoints"]
screen = ["user32.ScreenToClient", "user32.ClientToScreen"]
childpt = ["user32.ChildWindowFromPoint", "user32.ChildWindowFromPointEx"]
ischild = ["user32.IsChild"]
rect = ["user32.OffsetRect"]
charnext = [
    "user32.CharNextA",
    "user32.CharNextW",
    "user32.CharPrevA",
    "user32.CharPrevW",
]
adjust = [
    "user32.GetSystemMetrics",
    "user32.AdjustWindowRectEx",
    "user32.AdjustWindowRect",
]
frames = [
    "user32.GetWindowRect",
    "user32.GetClientRect",
    "user32.ClientToScreen",
    "user32.AdjustWindowRectEx",
    "user32.EqualRect",
]
nccalc = [
    "user32.SendMessageA",
    "user32.DefWindowProcA",
]
nchittest = [
    "user32.SendMessageW",
    "user32.DefWindowProcW",
]
