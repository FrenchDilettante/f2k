# editctl: one test per block of the real-machine capture (output.txt); see tests/README.md. No
# handle or address prints: an edit prints by its id. F2K's fonts are stand-ins for Windows', so
# nothing printed depends on a glyph's width: no positions (the caret's moves print as relations),
# short texts in ES_AUTOHSCROLL edits that never wrap or refuse text, and EN_HSCROLL and EN_VSCROLL
# not recorded. Typing is WM_CHAR posted to the focused edit: no key is pressed.
description = "editctl - the built-in Edit control, single-line and ES_MULTILINE, driven by messages: WM_SETTEXT, WM_GETTEXT and WM_GETTEXTLENGTH (SendMessageW and SendMessageA, short buffers); EM_SETSEL, EM_GETSEL and EM_REPLACESEL; EM_LIMITTEXT and EM_GETLIMITTEXT; EM_GETLINECOUNT, EM_LINEINDEX, EM_LINELENGTH, EM_LINEFROMCHAR and EM_GETLINE; EM_SETREADONLY; EM_CANUNDO, EM_UNDO, WM_UNDO and EM_EMPTYUNDOBUFFER; EM_GETMODIFY and EM_SETMODIFY; ES_UPPERCASE, ES_LOWERCASE and ES_NUMBER fed WM_CHAR posted to the control; and the EN_SETFOCUS, EN_KILLFOCUS, EN_UPDATE, EN_CHANGE and EN_MAXTEXT notifications its parent receives, in order."
kind = "sectioned"

# Not gated: F2K has no Edit control yet.

[pins]
# The exports each block pins, as dll.Export; scripts/compat.py derives each export's coverage from
# them. Only the exports a section calls itself and observes: the control is reached through
# messages, its procedure being no export (not the parent's class and window, SetForegroundWindow,
# GetWindowLongW, GetClassNameW, GetCaretPos, the queue's dispatch).
create = [
    "user32.CreateWindowExW",
    "user32.CreateWindowExA",
    "user32.SendMessageW",
    "user32.SendMessageA",
]
text = [
    "user32.SendMessageW",
    "user32.SendMessageA",
]
select = [
    "user32.SendMessageW",
    "user32.SendMessageA",
]
limit = [
    "user32.SendMessageW",
    "user32.PostMessageW",
]
lines = [
    "user32.SendMessageW",
    "user32.SendMessageA",
]
readonly = [
    "user32.SendMessageW",
    "user32.PostMessageW",
]
undo = [
    "user32.SendMessageW",
    "user32.PostMessageW",
]
modify = [
    "user32.SendMessageW",
    "user32.PostMessageW",
]
case = [
    "user32.SendMessageW",
    "user32.SendMessageA",
    "user32.PostMessageW",
    "user32.SetWindowLongW",
]
notify = [
    "user32.SendMessageW",
    "user32.PostMessageW",
    "user32.SetFocus",
]
