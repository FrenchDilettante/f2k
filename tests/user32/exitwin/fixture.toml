# exitwin: one test per block of the real-machine capture (output.txt); see tests/README.md. Built
# with /MD. The actions, flags and ntshutdown blocks are shutdowns Windows 2000 refuses for want of
# SeShutdownPrivilege enabled: each call is made only after the program has checked its token holds
# the privilege disabled, and no call is a logoff (EWX_LOGOFF needs no privilege). F2K checks no
# shutdown privilege, so the same calls would really shut its test boot down: those blocks are
# skipped on F2K, never booted, their captures what F2K's ExitWindowsEx and NtShutdownSystem leave
# out, documented. The undefined block's values carry bits Windows 2000 does not define, which it
# refuses with ERROR_ACCESS_DENIED before its privilege check, as F2K does: that block runs on F2K.
description = "exitwin - ExitWindowsEx and ntdll's NtShutdownSystem refused without SeShutdownPrivilege enabled: ExitWindowsEx with EWX_SHUTDOWN, EWX_REBOOT and EWX_POWEROFF, alone and with EWX_FORCE and EWX_FORCEIFHUNG; with several action bits and a nonzero dwReserved; NtShutdownSystem with each action and out-of-range ones: never run on F2K. ExitWindowsEx with bits Windows 2000 does not define (0x20, 0x40), refused before the privilege check: run on F2K."
kind = "sectioned"
gate = true

[skip]
actions = "F2K checks no shutdown privilege; the call would shut the test boot down"
flags = "F2K checks no shutdown privilege; the call would shut the test boot down"
ntshutdown = "F2K checks no shutdown privilege; the call would shut the test boot down"

[pins]
# The exports each block pins, as dll.Export; scripts/compat.py derives each export's coverage from
# them. Only what a section calls itself and observes, not its guard's token queries.
actions = ["user32.ExitWindowsEx"]
flags = ["user32.ExitWindowsEx"]
ntshutdown = ["ntdll.NtShutdownSystem"]
undefined = ["user32.ExitWindowsEx"]
