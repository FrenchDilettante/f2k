# exitwin: one test per block of the real-machine capture (output.txt); see tests/README.md. Built
# with /MD. Every block is a shutdown Windows 2000 refuses for want of SeShutdownPrivilege enabled:
# each call is made only after the program has checked its token holds the privilege disabled, and
# no call is a logoff (EWX_LOGOFF needs no privilege). F2K checks no shutdown privilege, so the same
# calls would really shut its test boot down: every block is skipped on F2K, never booted. Their
# captures are what F2K's ExitWindowsEx and NtShutdownSystem leave out, documented.
description = "exitwin - ExitWindowsEx and ntdll's NtShutdownSystem refused without SeShutdownPrivilege enabled: ExitWindowsEx with EWX_SHUTDOWN, EWX_REBOOT and EWX_POWEROFF, alone and with EWX_FORCE and EWX_FORCEIFHUNG; with several action bits, undefined bits and a nonzero dwReserved; NtShutdownSystem with each action and out-of-range ones. Never run on F2K."
kind = "sectioned"

[skip]
actions = "F2K checks no shutdown privilege; the call would shut the test boot down"
flags = "F2K checks no shutdown privilege; the call would shut the test boot down (Windows 2000's flag checks are not documented to come before its privilege check)"
ntshutdown = "F2K checks no shutdown privilege; the call would shut the test boot down"

[pins]
# The exports each block pins, as dll.Export; scripts/compat.py derives each export's coverage from
# them. Only what a section calls itself and observes, not its guard's token queries.
actions = ["user32.ExitWindowsEx"]
flags = ["user32.ExitWindowsEx"]
ntshutdown = ["ntdll.NtShutdownSystem"]
