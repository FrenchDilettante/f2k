# guiclass: one test per block of the real-machine capture (output.txt); see tests/README.md.
description = "guiclass - window class registration in user32: RegisterClassA/W and RegisterClassExA/W (atom return, error), GetClassInfoA/W and GetClassNameA/W read back on a live window, duplicate registration (1410), UnregisterClassA/W (1411), and the error cases (NULL wndproc, bogus atom); GetClassInfoExW/A of a class with extra bytes, an icon and a menu name (every field, by name and by atom, cbSize 0, NULL hInstance, an unknown name) and of the system classes Button and #32770; GetClassLongW/A of each GCL_ index, and SetClassLongW/A of the extra bytes (in range, straddling and past the end), GCL_STYLE, GCL_HBRBACKGROUND and GCL_WNDPROC."
kind = "sectioned"
gate = true
screenshots = true

[pending]
infoex = "user32 has no GetClassInfoExW or GetClassInfoExA yet"
classlong = "user32 has no GetClassLongW, GetClassLongA, SetClassLongW or SetClassLongA yet"

[pins]
# The exports each block pins, as dll.Export ("*": every block, what the C runtime's startup
# calls); scripts/compat.py derives each export's coverage from them.
register = [
    "user32.RegisterClassA",
    "user32.RegisterClassExA",
    "user32.RegisterClassExW",
    "user32.RegisterClassW",
]
query = [
    "user32.GetClassInfoA",
    "user32.GetClassInfoW",
    "user32.GetClassNameA",
    "user32.GetClassNameW",
    "user32.CreateWindowExA",
    "user32.DestroyWindow",
]
duplicate = [
    "user32.RegisterClassA",
    "user32.RegisterClassW",
]
unregister = [
    "user32.UnregisterClassA",
    "user32.UnregisterClassW",
    "user32.GetClassInfoA",
]
errors = [
    "user32.RegisterClassA",
    "user32.GetClassInfoA",
]
infoex = [
    "user32.GetClassInfoExW",
    "user32.GetClassInfoExA",
]
classlong = [
    "user32.GetClassLongW",
    "user32.GetClassLongA",
    "user32.SetClassLongW",
    "user32.SetClassLongA",
]
