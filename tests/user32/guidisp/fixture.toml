[pins]
# The exports each block pins, as dll.Export ("*": every block, what the C runtime's startup
# calls); scripts/compat.py derives each export's coverage from them.
enum = [
    "user32.EnumDisplaySettingsA",
    "user32.EnumDisplaySettingsW",
]
change = [
    "user32.ChangeDisplaySettingsA",
    "user32.ChangeDisplaySettingsW",
]
devices = [
    "user32.EnumDisplayDevicesA",
    "user32.EnumDisplayDevicesW",
]
caps = [
    "gdi32.CreateDCA",
    "gdi32.GetDeviceCaps",
    "gdi32.DeleteDC",
]
metrics = [
    "user32.GetSystemMetrics",
    "user32.SystemParametersInfoA",
    "user32.SystemParametersInfoW",
]
colors = [
    "user32.GetSysColor",
    "user32.GetSysColorBrush",
    "user32.SetSysColors",
]
monitors = [
    "user32.EnumDisplayMonitors",
    "user32.MonitorFromWindow",
    "user32.MonitorFromPoint",
    "user32.MonitorFromRect",
    "user32.GetMonitorInfoA",
]
