# guidisp: one test per block of the real-machine capture (output.txt); see tests/README.md.
description = "guidisp - the display device and settings surface (the app-visible face of the graphics kernel): EnumDisplaySettingsA/W (current and mode 0), ChangeDisplaySettingsA/W (current mode, CDS_TEST, bogus mode, NULL), EnumDisplayDevicesA/W, gdi32 CreateDCA/GetDeviceCaps/DeleteDC on the DISPLAY driver, GetSystemMetrics, SystemParametersInfoA/W SPI_GETWORKAREA, GetSysColor/GetSysColorBrush/SetSysColors round-trip, and the single-monitor calls (EnumDisplayMonitors, MonitorFromWindow/Rect/Point, GetMonitorInfoA)."
kind = "sectioned"
screenshots = true

[pending]
enum = "graphics kernel not landed yet"
change = "graphics kernel not landed yet"
devices = "graphics kernel not landed yet"
caps = "graphics kernel not landed yet"
metrics = "graphics kernel not landed yet"
colors = "graphics kernel not landed yet"
