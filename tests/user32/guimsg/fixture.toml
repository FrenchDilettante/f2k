# guimsg: one test per block of the real-machine capture (output.txt); see tests/README.md.
description = "guimsg - the message loop in user32: PostMessageA + GetMessageA (message, wParam, lParam, hwnd), PeekMessageA PM_NOREMOVE vs PM_REMOVE order, PostQuitMessage (GetMessage returns 0, WM_QUIT, wParam = exit code), TranslateMessage + DispatchMessageA into the wndproc, SendMessageA/W same-thread, DefWindowProcA WM_CLOSE destroying the window, PostThreadMessageA thread messages; RegisterWindowMessageW/A (the range, one value per name in either form and case); GetMessageTime and GetMessagePos against the retrieved MSG; WaitMessage with a message already posted, after a peek, and woken by another thread; SendMessageTimeoutW/A to the same thread, another thread, a busy one (SMTO_NORMAL, SMTO_ABORTIFHUNG) and a hung one, with IsHungAppWindow; SendNotifyMessageW/A to the same thread and another, and a pointer message refused across threads; the posted-message quota (quota); WM_SETTEXT and WM_COPYDATA posted (postptr); WM_COPYDATA sent by another process (copydata); DefWindowProcW's WM_SETICON and WM_GETICON (icon), WM_SETREDRAW (redraw), WM_SYSCOMMAND SC_MINIMIZE, SC_MAXIMIZE and SC_RESTORE (syscmd) and WM_CONTEXTMENU handed to the parent (ctxmenu); sends to a window whose thread has ended (deadthr); KillTimer of live, killed and unknown timers, window and thread timers, the desktop's and a destroyed window, and from a second thread (killtimer); MsgWaitForMultipleObjectsEx with posted, peeked and timer input against the QS_ masks, MWMO_INPUTAVAILABLE, events, MWMO_WAITALL, MWMO_ALERTABLE, timeouts and refusals (msgwait); and the posted-message quota exactly: the count of posts one queue takes, the failing post's last error, PostThreadMessage and another thread's posts to the full queue, one post more once a message is taken out (postlimit)."
kind = "sectioned"
gate = true
# hung waits 6.5 s for Windows to deem a thread hung, and the thread sleeps 9.5 s.
timeout = 40
# So hung boots on its own, beside the other sections' boot, instead of holding it up.
separate = ["hung"]

[pins]
# The exports each block pins, as dll.Export ("*": every block, what the C runtime's startup
# calls); scripts/compat.py derives each export's coverage from them.
post = [
    "user32.PostMessageA",
    "user32.GetMessageA",
]
peek = [
    "user32.PeekMessageA",
    "user32.PostMessageA",
]
quit = [
    "user32.PostQuitMessage",
    "user32.GetMessageA",
]
dispatch = [
    "user32.PostMessageA",
    "user32.GetMessageA",
    "user32.TranslateMessage",
    "user32.DispatchMessageA",
]
send = [
    "user32.SendMessageA",
    "user32.SendMessageW",
]
defproc = [
    "user32.DefWindowProcA",
    "user32.DefWindowProcW",
    "user32.IsWindow",
    "user32.DestroyWindow",
]
threadmsg = [
    "user32.PostThreadMessageA",
    "user32.GetMessageA",
]
regmsg = [
    "user32.RegisterWindowMessageW",
    "user32.RegisterWindowMessageA",
]
msgpos = [
    "user32.GetMessageTime",
    "user32.GetMessagePos",
    "user32.GetMessageW",
]
# The 300 ms timer's WM_TIMER is what ends the second WaitMessage.
wait = ["user32.WaitMessage", "user32.SetTimer"]
# PostThreadMessageW's WM_QUIT is what ends the second thread ("the second thread ended").
smto = [
    "user32.SendMessageTimeoutW",
    "user32.SendMessageTimeoutA",
    "user32.PostThreadMessageW",
]
hung = [
    "user32.SendMessageTimeoutW",
    "user32.IsHungAppWindow",
    "user32.PostThreadMessageW",
]
notify = [
    "user32.SendNotifyMessageW",
    "user32.SendNotifyMessageA",
    "user32.PostThreadMessageW",
]
quota = ["user32.PostMessageW", "user32.PeekMessageW"]
postptr = ["user32.PostMessageW", "user32.PostMessageA"]
copydata = [
    "user32.SendMessageA",
    "user32.PostMessageA",
    "user32.MsgWaitForMultipleObjects",
    "kernel32.CreateProcessA",
]
icon = ["user32.SendMessageW", "user32.DefWindowProcW", "user32.LoadIconA"]
redraw = [
    "user32.SendMessageW",
    "user32.DefWindowProcW",
    "user32.IsWindowVisible",
    "user32.UpdateWindow",
]
syscmd = [
    "user32.SendMessageW",
    "user32.DefWindowProcW",
    "user32.IsIconic",
    "user32.IsZoomed",
]
ctxmenu = ["user32.SendMessageW", "user32.DefWindowProcW"]
deadthr = [
    "user32.IsWindow",
    "user32.SendMessageW",
    "user32.SendMessageTimeoutW",
    "user32.PostMessageW",
]
killtimer = [
    "user32.KillTimer",
    "user32.SetTimer",
]
# MsgWaitForMultipleObjectsEx is found with GetProcAddress (MSVC 6's headers declare it for WINVER
# 0x0500 only).
msgwait = ["user32.MsgWaitForMultipleObjectsEx"]
postlimit = [
    "user32.PostMessageW",
    "user32.PostMessageA",
    "user32.PostThreadMessageW",
    "user32.PostThreadMessageA",
    "user32.PeekMessageW",
]
