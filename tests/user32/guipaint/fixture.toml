# guipaint: one test per block of the real-machine capture (output.txt); see tests/README.md.
description = "guipaint - painting in user32: InvalidateRect (whole and subrect) with GetUpdateRect/ValidateRect, the WM_PAINT path through ShowWindow/UpdateWindow with BeginPaint/EndPaint recording PAINTSTRUCT (hdc, fErase, rcPaint in client coordinates), a shown window's SetWindowPos resize and what the update region and BeginPaint then report (with SWP_NOREDRAW), and the bogus-handle errors (1400)."
kind = "sectioned"
gate = true
screenshots = true

[pins]
# The exports each block pins, as dll.Export ("*": every block, what the C runtime's startup
# calls); scripts/compat.py derives each export's coverage from them.
invalidate = [
    "user32.InvalidateRect",
    "user32.GetUpdateRect",
    "user32.ValidateRect",
]
subrect = [
    "user32.InvalidateRect",
    "user32.GetUpdateRect",
    "user32.ValidateRect",
    "user32.BeginPaint",
    "user32.EndPaint",
]
paint = [
    "user32.ShowWindow",
    "user32.InvalidateRect",
    "user32.UpdateWindow",
    "user32.BeginPaint",
    "user32.EndPaint",
    "user32.GetUpdateRect",
]
beginend = [
    "user32.InvalidateRect",
    "user32.BeginPaint",
    "user32.EndPaint",
]
resize = [
    "user32.ShowWindow",
    "user32.UpdateWindow",
    "user32.GetUpdateRect",
    "user32.SetWindowPos",
    "user32.BeginPaint",
    "user32.EndPaint",
]
errors = [
    "user32.BeginPaint",
    "user32.EndPaint",
    "user32.InvalidateRect",
    "user32.GetUpdateRect",
]
