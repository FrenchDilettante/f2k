# guiwin: one test per block of the real-machine capture (output.txt); see tests/README.md.
description = "guiwin - the window lifecycle in user32: CreateWindowExA/W (hwnd return, wndproc traffic WM_NCCREATE/WM_CREATE, unknown-class error 1407), GetDesktopWindow, IsWindow, DestroyWindow (WM_DESTROY, 1400 on a dead handle), LoadCursorA/W stock cursors; a creation refused by WM_NCCREATE answering 0 or WM_CREATE answering -1 (refuse), and a destroyed handle against the next window made (uniq)."
kind = "sectioned"
gate = true

[pins]
# The exports each block pins, as dll.Export ("*": every block, what the C runtime's startup
# calls); scripts/compat.py derives each export's coverage from them.
create = [
    "user32.CreateWindowExA",
    "user32.CreateWindowExW",
    "user32.IsWindow",
]
desktop = [
    "user32.GetDesktopWindow",
    "user32.IsWindow",
]
destroy = [
    "user32.DestroyWindow",
    "user32.IsWindow",
]
cursor = [
    "user32.LoadCursorA",
    "user32.LoadCursorW",
]
refuse = [
    "user32.CreateWindowExA",
    "user32.CreateWindowExW",
    "user32.DefWindowProcA",
]
uniq = [
    "user32.CreateWindowExA",
    "user32.DestroyWindow",
    "user32.IsWindow",
]

[masks]
# The process's first window, a popup, leaves ERROR_ALREADY_EXISTS (183) as the last error on the
# real machine: something Windows 2000's user32 makes along with a thread's first window (F2K makes
# nothing then, and leaves it alone). The creation itself and its messages are pinned literally.
refuse = ["CreateWindowExA, let through: NULL no err=*"]
