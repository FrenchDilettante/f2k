    "user32.SetForegroundWindow",
    "user32.GetForegroundWindow",
    "user32.GetKeyboardLayout",
    "user32.SendInput",
    "user32.PeekMessageW",
    "user32.TranslateMessage",
    "user32.DispatchMessageW",
