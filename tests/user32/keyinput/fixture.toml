# keyinput: one test per block of the real-machine capture (output.txt); see tests/README.md. Its
# keystrokes are injected with SendInput into its own window, and only while that window is the
# foreground window: each block prints whether it was, and sends nothing when it was not. No handle
# or address prints; the messages, their wParam and lParam, and GetKeyState's down bits do.
description = "keyinput - keystrokes injected with SendInput into the program's own foreground window: WM_KEYDOWN, WM_KEYUP, WM_SYSKEYDOWN, WM_SYSKEYUP and TranslateMessage's WM_CHAR and WM_SYSCHAR for the US layout (wParam, lParam's repeat count, scan code and flags), GetKeyState's down bits during each; letters, Shift, digits, calc's symbols and the keypad's operators, Enter, Escape, Backspace, Tab, Ctrl+C, Alt+F and Alt alone, the extended arrows and Delete, a scan code alone and a virtual key with no scan code, a key pressed twice before its release, an A window pumped through PeekMessageA and DispatchMessageA, and the window a keystroke goes to when the focus moves, is taken away or is destroyed after the keystroke and before the read, with reads filtered by window and by message (typeahead)."
kind = "sectioned"
gate = true

[pending]
control = "the capture machine held Enter down as the block began (its key-up lost before the capture ran), so the block's first Enter shows the previous-state bit set (lParam 0x401C0001), where F2K's key state starts with Enter up; the same capture's ansi Enter, and the capture before it, show the bit clear: a recapture of the block clears it"

[pins]
# The exports each block pins, as dll.Export; scripts/compat.py derives each export's coverage from
# them. Only the exports a section observes, not the helpers it calls around them (the class and
# window, SetFocus, GetProcAddress). typeahead observes its child windows, the focus and the active
# window, so it pins CreateWindowExW, SetFocus, GetFocus, GetActiveWindow and DestroyWindow too.
letters = [
    "user32.SetForegroundWindow",
    "user32.GetForegroundWindow",
    "user32.GetKeyboardLayout",
    "user32.SendInput",
    "user32.PeekMessageW",
    "user32.TranslateMessage",
    "user32.DispatchMessageW",
    "user32.GetKeyState",
]
