    "user32.GetMenuItemRect",
]
track = [
    "user32.TrackPopupMenu",
    "user32.TrackPopupMenuEx",
]
cues = [
    "user32.SystemParametersInfoW",
    "user32.SendMessageW",
    "user32.CreateDialogIndirectParamW",
]
capicon = [
    "user32.CreateIconIndirect",
    "user32.RegisterClassExW",
    "user32.GetClassLongW",
    "user32.SendMessageW",
    "user32.GetSystemMetrics",
]
underline = [
    "user32.SystemParametersInfoW",
    "user32.SetForegroundWindow",
    "user32.SendInput",
    "user32.DefWindowProcW",
    "user32.GetMenuItemRect",
    "user32.SendMessageW",
    "user32.DrawMenuBar",
    "user32.GetWindowDC",
    "gdi32.GetPixel",
]
# EndMenu is found with GetProcAddress (MSVC 6's headers declare it for WINVER 0x0500 only).
endmenu = ["user32.EndMenu", "user32.TrackPopupMenu"]
