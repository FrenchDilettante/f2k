# menus: one test per block of the real-machine capture (output.txt); see tests/README.md. Its menu
# is compiled from menus.rc (rc) and linked into menus.exe. No handle or address prints: a menu
# prints as found or not and as the same menu as another call's or not, its items' states in hex.
description = "menus - a MENU resource of the program's own (menus.rc): LoadMenuW/A, IsMenu and DestroyMenu; GetMenuItemCount, GetMenuItemID, GetSubMenu, GetMenuState and GetMenuStringA/W by position and by command, through the bar and a nested popup; CheckMenuItem's and EnableMenuItem's previous states; CheckMenuRadioItem by command and by position; GetMenu and SetMenu on a top-level and a child window, and the menu destroyed with its window."
kind = "sectioned"

# Not gated: win32k has no menu objects yet, and menus.exe imports catalogued records user32 does
# not export yet, so it does not load. Every section is on the work list.
[pending]
load = "LoadMenuW/A, IsMenu and DestroyMenu not yet implemented: win32k has no menu objects"
items = "GetMenuItemCount, GetMenuItemID, GetSubMenu, GetMenuState and GetMenuStringA/W not yet implemented"
check = "CheckMenuItem and CheckMenuRadioItem not yet implemented"
enable = "EnableMenuItem not yet implemented"
window = "GetMenu and SetMenu not yet implemented: a window holds no menu"

[pins]
# The exports each block pins, as dll.Export; scripts/compat.py derives each export's coverage from
# them. Only the exports a section observes, not the helpers it calls around them (the load and
# destruction of the menu in the sections but load, RegisterClassW, CreateWindowExW).
load = [
    "user32.LoadMenuW",
    "user32.LoadMenuA",
    "user32.IsMenu",
    "user32.DestroyMenu",
]
items = [
    "user32.GetMenuItemCount",
    "user32.GetMenuItemID",
    "user32.GetSubMenu",
    "user32.GetMenuState",
    "user32.GetMenuStringW",
    "user32.GetMenuStringA",
]
check = [
    "user32.CheckMenuItem",
    "user32.CheckMenuRadioItem",
    "user32.GetMenuState",
]
enable = [
    "user32.EnableMenuItem",
    "user32.GetMenuState",
]
window = [
    "user32.GetMenu",
    "user32.SetMenu",
    "user32.IsMenu",
    "user32.DestroyWindow",
]
