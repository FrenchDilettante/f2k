# timers: one test per block of the real-machine capture (output.txt); see tests/README.md.
# Built and captured on the 2026-11-27 VM trip (tests\build.bat timers, tests\capture.bat timers).
# Its window is a hidden 64x48 tool popup, shown without activation where WM_PAINT takes part.
# Timer ids SetTimer chooses print only as relations; timing-shaped facts as verdicts against bands.
# It imports nothing F2K lacks: once captured, the blocks F2K fails go to [pending] with their
# reasons.
description = "timers - SetTimer's answers for window and thread timers (ids 0, 1, 0xFFFF, a timer set again, a thread timer's id reused, destroyed, other threads' and the desktop window), WM_TIMER coalescing, WM_TIMER's place after posted messages and WM_PAINT and two due timers' order, a timer set again restarting its period, TIMERPROC callbacks through DispatchMessageW (and a WM_TIMER posted by hand), filtered PeekMessageW, elapse values at the edges, and the rate of a 50 ms timer."
kind = "sectioned"
gate = true

[pending]
ids = "SetTimer(NULL, 0) answers id 1, the id the window's timer holds, where Windows 2000 answers another"
order = "due timers are delivered in the order they were set, where Windows 2000 delivers the one set last first"
proc = "DispatchMessageW of a WM_TIMER posted by hand with a TIMERPROC in its lParam calls the TIMERPROC, where Windows 2000 calls nothing and answers 0 (no such timer); the dispatches' return values, the tick count, are masked"
elapse = "SetTimer with an elapse of 0x80000000 or 0xFFFFFFFF waits that long, where Windows 2000 takes it as its minimum (a WM_TIMER within 200 ms)"

[masks]
# DispatchMessageW of a WM_TIMER with a TIMERPROC answers whatever the VOID TIMERPROC left in eax:
# on the real machine a tick-count-like value, machine-specific.
proc = [
    "DispatchMessageW: ret=* err=-, the window procedure's WM_TIMER count 0",
    "DispatchMessageW: ret=* err=-",
]

[pins]
# The exports each block pins, as dll.Export; scripts/compat.py derives each export's coverage from
# them. Only the exports a section observes, not the helpers around them (the class and window,
# the message pump that drains between steps).
ids = ["user32.SetTimer", "user32.KillTimer", "user32.PeekMessageW"]
coalesce = ["user32.SetTimer", "user32.KillTimer", "user32.PeekMessageW"]
order = [
    "user32.SetTimer",
    "user32.KillTimer",
    "user32.InvalidateRect",
    "user32.PostMessageW",
    "user32.PeekMessageW",
]
reset = ["user32.SetTimer", "user32.KillTimer"]
proc = [
    "user32.SetTimer",
    "user32.KillTimer",
    "user32.DispatchMessageW",
    "user32.PostMessageW",
]
filter = ["user32.SetTimer", "user32.KillTimer", "user32.PeekMessageW"]
elapse = ["user32.SetTimer", "user32.KillTimer"]
rate = [
    "user32.SetTimer",
    "user32.KillTimer",
    "user32.MsgWaitForMultipleObjects",
    "user32.PeekMessageW",
]
