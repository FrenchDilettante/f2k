# wndlong: one test per block of the real-machine capture (output.txt); see tests/README.md. No
# handle or address prints: a window procedure prints as the same as a given procedure or not; the
# styles, ids, user data and extra bytes print as values.
description = "wndlong - a window's data through GetWindowLongW/A and SetWindowLongW/A: GWL_STYLE and GWL_EXSTYLE with WM_STYLECHANGING/WM_STYLECHANGED, GWL_ID, GWL_HWNDPARENT, GWL_HINSTANCE, GWL_USERDATA, the class's extra bytes (and GetWindowWord/SetWindowWord) and their bounds, GWL_WNDPROC subclassing through both forms (the chain through CallWindowProcW/A, IsWindowUnicode), a dialog's DWL_DLGPROC, DWL_USER and DWL_MSGRESULT (CreateDialogIndirectParamW), and the errors on NULL and destroyed windows."
kind = "sectioned"
gate = true

[pending]
dialog = "CreateDialogIndirectParamW and the DWL_ values: the dialog manager"

[pins]
# The exports each block pins, as dll.Export; scripts/compat.py derives each export's coverage from
# them. Only the exports a section observes, not the helpers it calls around them (the classes and
# windows, SendMessageW/A, GetClassNameW, GetProcAddress).
style = [
    "user32.GetWindowLongW",
    "user32.GetWindowLongA",
    "user32.SetWindowLongW",
    "user32.SetWindowLongA",
