# The userland workspace's build: everything here runs in ring 3, as PE32 images for the system's
# own target (i686-f2k-pe.json: i686 Windows in its MSVC environment, linked by the toolchain's
# rust-lld in its lld-link mode). The outputs land in target/userland/, where the kernel's build
# script finds the DLLs it embeds.

[build]
target = "i686-f2k-pe.json"
target-dir = "../target/userland"

[unstable]
build-std = ["core", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]
json-target-spec = true
