# The userland workspace: the code that runs in ring 3, built for its own target
# (.cargo/config.toml). The root workspace excludes it.
[workspace]
members = ["rtl", "ntdll", "kernel32"]
resolver = "2"

# Panic behaviour is not set here: the target spec (i686-f2k-pe.json) says panic-strategy
# "abort", and a profile-level `panic` would leak into the host unit tests' from-source std build.
[profile.release]
opt-level = 2
