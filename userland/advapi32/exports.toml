# ADVAPI32.dll's exports: the one source every list of them derives from (the format is
# kernel32's, documented in userland/kernel32/exports.toml).
#
# F2K's advapi32 exports what the corpus fixtures (tests/advapi32) and cmd.exe import: its own code
# over ntdll and kernel32, as Windows 2000's advapi32 imports them, and stubs for what is not
# written yet. The rest of the records are catalogued from ADVAPI32.dll 5.0.2195.6710's export table
# (scripts/catalogue_exports.py): their name and ordinal. Implementing one gives it its group,
# prototype and implementation.

[[group]]
key = "registry"
title = "registry"

[[group]]
key = "security"
title = "security"

