[package]
name = "cmd"
version = "0.1.0"
edition = "2021"

# The shell's reading of a line and what it prints, host-testable.
[lib]
name = "cmd"
path = "src/lib.rs"

# The program: cmd.exe (the target names its images .dll: the Makefile copies it to its name).
[[bin]]
name = "cmd"
path = "src/main.rs"
test = false

[dependencies]
exe = { path = "../exe" }
