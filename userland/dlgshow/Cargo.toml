[package]
name = "dlgshow"
version = "0.1.0"
edition = "2021"

# dlgshow's lines, host-testable.
[lib]
name = "dlgshow"
path = "src/lib.rs"

# The program: dlgshow.exe (the target names its images .dll: the Makefile copies it to its name).
[[bin]]
name = "dlgshow"
path = "src/main.rs"
test = false

[dependencies]
exe = { path = "../exe" }
