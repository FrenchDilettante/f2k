[package]
name = "ehprolog"
version = "0.1.0"
edition = "2021"

# ehprolog's checks of the frame and the lines it prints, host-testable.
[lib]
name = "ehprolog"
path = "src/lib.rs"

# The program: ehprolog.exe (the target names its images .dll: the Makefile copies it to its name).
[[bin]]
name = "ehprolog"
path = "src/main.rs"
test = false

[dependencies]
exe = { path = "../exe" }
