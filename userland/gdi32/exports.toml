# GDI32.dll's exports: the one source every list of them derives from (the format is
# kernel32's, documented in userland/kernel32/exports.toml).
#
# F2K's gdi32 exports the screen DC's surface: CreateDC of the display, DeleteDC and its device
# capabilities, the stock objects and their selection, solid brushes and PatBlt's fills, the text
# and background colors and the background mode, text drawn with the built-in font or a TrueType
# font and its metrics, the TrueType fonts themselves (loading, font objects, their metrics, data,
# glyphs and enumeration), and single pixels; and stubs for what the corpus fixtures import beyond
# it (bitmaps). Its own code runs over ntdll, kernel32 and user32 as Windows 2000's gdi32 imports
# them, and enters the kernel itself, as Windows 2000's does: through win32k's services (`impl = {
# syscall = "<the kernel's typed handler>" }`, `internal = true`: its own calls, never exported;
# see userland/user32/exports.toml for the stubs' shape). Their argument lists are F2K's own (only
# gdi32 calls them; the kernel's handlers in kernel/src/win32k/dc.rs, brush.rs and fonts describe
# them). The rest of the records are catalogued from GDI32.dll 5.0.2195.6660's export table
# (scripts/catalogue_exports.py): their name and ordinal. Implementing one gives it its group,
# prototype and implementation.

[[group]]
key = "dc"
title = "device contexts"

[[group]]
key = "objects"
title = "stock objects"

[[group]]
key = "attributes"
title = "colors and modes"

[[group]]
key = "text"
title = "text"

[[group]]
key = "pixels"
title = "pixels"

[[group]]
key = "fonts"
title = "fonts"

[[group]]
key = "bitmaps"
title = "bitmaps"

[[group]]
key = "brushes"
title = "brushes and fills"

[[group]]
key = "regions"
title = "regions and clipping"

[[group]]
key = "drawing"
title = "pens, lines and shapes"

[[group]]
key = "coordinates"
title = "coordinate spaces and transforms"

