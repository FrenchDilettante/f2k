[package]
name = "kernel32"
version = "0.1.0"
edition = "2021"

# kernel32's user-mode code, host-testable: its exports' bodies as they move out of the kernel (none
# yet: every export is a kernel-served stub or a forwarder).
[lib]
name = "kernel32"
path = "src/lib.rs"

# The DLL: the library's exports and the generated service stubs.
[[bin]]
name = "kernel32"
path = "src/main.rs"
test = false

[dependencies]
rtl = { path = "../rtl" }

# The build script generates the stubs and the .def from the export specs.
[build-dependencies]
exportgen = { path = "../../tools/exportgen" }
