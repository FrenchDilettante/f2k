    "sync/waitmulti",
    "threads/create",
    "threads/priority",
]

[[export]]
name = "UnhandledExceptionFilter"
group = "termination"
args = ["ptr ExceptionInfo"]
impl = { native = "UnhandledExceptionFilter" }
note = "the top-level filter's verdict when it gives one other than continue search, else execute the handler (no debugger, the fault dialog suppressed): the process ends with the code"
pinned_by = ["runtime/unhandled", "bare/null-write"]

[[export]]
name = "BaseProcessStartThunk"
group = "termination"
args = []
impl = { native = "BaseProcessStartThunk" }
internal = true
note = "every image's main thread starts here (EAX its entry point): BaseProcessStart calls it under kernel32's exception frame, its return value to ExitThread. Windows 2000's kernel32 does not export it; F2K's kernel, which makes the process, finds it by name"

