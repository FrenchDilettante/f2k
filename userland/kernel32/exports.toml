# kernel32.dll's exports: the one source every list of them derives from.
#
# tools/exportgen reads this file and generates the kernel's service registry (the kernel's build
# script) and, for the DLL build, the module-definition file and the service stubs
# (userland/build-support/stubs.rs). Never copy an export's facts elsewhere: derive them from here.
#
# The file is TOML in the subset tools/exportgen/src/toml.rs reads (it refuses anything else).
#
# [[group]]      an API group, the unit the exports are reported by:
#   key          its key (exports name it), title  its heading
#
# [[export]]     one export, in its group's section:
#   name         the export name (case-sensitive, as GetProcAddress matches it)
#   group        its API group's key
#   args         the prototype's arguments, first first: "<kind> <name>". The kind says what the
#                caller pushes:
#                  u32          a dword value (counts, flags, code addresses)
#                  i32          a signed dword (a count where -1 means "to the NUL")
#                  bool         a Win32 BOOL (nonzero is true)
#                  handle       a handle value
#                  ptr          a pointer into caller memory
#                  ptr<T>       a pointer to one T (u8, u16, u32, i32, u64)
#                  u64          a quadword by value (two dwords, low first)
#                  strA, strW   a NUL-terminated string the call reads; strA? allows NULL, strA[260]
#                               gives the platform's limit on its length in units, the NUL included
#                the argument block its callers push and its body pops (stdcall) is 4 bytes per
#                argument, 8 per u64
#   impl         how it is implemented, an inline table with one key:
#                  { legacy = "<handler>" }   the kernel serves it through a handler on the raw
#                                             argument block, fn(&mut TrapFrame, &[u32]) (its path in
#                                             compat::kernel32's scope): the kernel's served
#                                             surface, until its group moves to user mode
#                  { native = "<body>" }      it runs in user mode: the DLL's own code, an
#                                             f2k_export_<Name> symbol (build-support/stubs.rs)
#                  { forward = "MODULE.Export" }  forwarded to another module's export (the same
#                                             prototype)
#                  { floor = "<why>" }        a deliberate fixed answer (zero, the kernel's shared
#                                             floor handler), and why
#                  { unimplemented = "<why>" }  listed but not exported yet
#   ordinal      optional: the export ordinal, from the platform's own table (none yet: the
#                ordinals are sequential placeholders)
#   fails        optional: its failure return value: an integer (0, -1, 0x...), FALSE, NULL,
#                INVALID_HANDLE_VALUE, WAIT_FAILED, INVALID_FILE_SIZE, INVALID_SET_FILE_POINTER,
#                INVALID_FILE_ATTRIBUTES, TLS_OUT_OF_INDEXES, or void / never
#   note         optional: a fact worth keeping beside the export
#   pinned_by    optional: the fixture blocks pinning its behavior: "<fixture>/<section>", or
#                "<fixture>/*" for every block of the fixture
#   scenarios    optional: the host scenarios pinning it (test function names)
#   unpinned     optional: why an implemented export has no evidence yet
#   internal     optional: true for an F2K-internal entry point, not a Windows 2000 export
#
# Service numbers are internal (the registry and the stubs are both generated): the served
# exports across the system DLLs' specs are numbered from 0x2000, ExitProcess first (0x2001), the
# others in case-insensitive name order.
#
# What kernel32 exports today is the kernel's served surface, exactly the corpus's import surface:
# every served export a kernel stub, RtlUnwind a forwarder into ntdll (as on Windows 2000).

[[group]]
key = "termination"
title = "termination"

[[group]]
key = "startup"
title = "command line / startup info"

[[group]]
key = "console"
title = "console handles"

[[group]]
key = "environment"
title = "environment"

[[group]]
key = "heap"
title = "heap"

[[group]]
key = "locale"
title = "locale / string conversion"

[[group]]
key = "threads"
title = "threads / sync"

[[group]]
key = "files"
title = "file handles"

[[group]]
key = "virtual-memory"
title = "virtual memory"

# --- termination ----------------------------------------------------------------------------------

[[export]]
name = "ExitProcess"
group = "termination"
args = ["u32 uExitCode"]
impl = { legacy = "svc_exit_process" }

[[export]]
name = "TerminateProcess"
group = "termination"
args = ["handle hProcess", "u32 uExitCode"]
impl = { floor = "FALSE, the process not ended: the corpus imports it but never calls it" }

[[export]]
name = "GetCurrentProcess"
group = "termination"
args = []
impl = { legacy = "svc_get_current_process" }

[[export]]
name = "UnhandledExceptionFilter"
group = "termination"
args = ["ptr ExceptionInfo"]
impl = { floor = "EXCEPTION_CONTINUE_SEARCH (zero), no effect: the corpus imports it but never calls it" }

[[export]]
name = "GetProcAddress"
group = "termination"
args = ["handle hModule", "ptr lpProcName"]
impl = { legacy = "crate::exec::modules::svc_get_proc_address" }

[[export]]
name = "LoadLibraryA"
group = "termination"
args = ["strA lpFileName"]
impl = { legacy = "crate::exec::modules::svc_load_library_a" }

[[export]]
name = "RtlUnwind"
group = "termination"
args = ["ptr TargetFrame", "u32 TargetIp", "ptr ExceptionRecord", "u32 ReturnValue"]
impl = { forward = "NTDLL.RtlUnwind" }

