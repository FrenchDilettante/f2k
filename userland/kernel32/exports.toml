# kernel32.dll's exports: the one source every list of them derives from.
#
# tools/exportgen reads this file and generates the kernel's tables of the DLL's exports and native
# exports (the kernel's build script; the kernel's tests check the built DLL against them), and, for
# the DLL build, the module-definition file (userland/build-support/stubs.rs). scripts/compat.py
# reports over it. Never copy an export's facts elsewhere: derive them from here.
#
# The file is TOML in the subset tools/exportgen/src/toml.rs reads (it refuses anything else).
#
# [[group]]      an API group, the unit the compatibility report groups by:
#   key          its key (exports name it), title  its heading
#
# [[export]]     one export, in its group's section:
#   name         the export name (case-sensitive, as GetProcAddress matches it)
#   group        its API group's key
#   args         the prototype's arguments, first first: "<kind> <name>". The kind says what the
#                caller pushes and, for a system service (ntdll's), what its kernel handler
#                receives:
#                  u32          a dword value (counts, flags, code addresses)        u32
#                  i32          a signed dword (a count where -1 means "to the NUL")  i32
#                  bool         a Win32 BOOL (nonzero is true)                       bool
#                  handle       a handle value                                       Handle
#                  ptr          a pointer into caller memory                         UserAddr
#                  ptr<T>       a pointer to one T (u8, u16, u32, i32, u64)          UserPtr<T>
#                  u64          a quadword by value (two dwords, low first)          u64
#                  strA, strW   a NUL-terminated string the call reads (not a system service's);
#                               strA? allows NULL, strA[260] gives the platform's limit on its
#                               length in units, the NUL included
#                the argument block its callers push and its body pops (stdcall) is 4 bytes per
#                argument, 8 per u64
#   impl         how it is implemented, an inline table with one key:
#                  { native = "<body>" }      it runs in user mode: the DLL's own code, an
#                                             `f2k_export_<Name>` body in its Rust or assembly
#                  { syscall = "<path>" }     ntdll's system services only: the stub raises the gate
#                                             on Windows 2000's number (see userland/ntdll/exports.toml)
#                  { forward = "MODULE.Export" }  forwarded to another module's export (the same
#                                             prototype)
#                no export enters the kernel but ntdll's system services: kernel32 is user code
#   ordinal      the export ordinal, from Windows 2000's own table (an F2K-internal export has
#                none: it takes a free one)
#   zw_ordinal   a system service's only (ntdll's): its Zw alias's ordinal
#   fails        optional: its failure return value: an integer (0, -1, 0x...), FALSE, NULL,
#                INVALID_HANDLE_VALUE, WAIT_FAILED, INVALID_FILE_SIZE, INVALID_SET_FILE_POINTER,
#                INVALID_FILE_ATTRIBUTES, TLS_OUT_OF_INDEXES, or void / never (it returns nothing /
#                cannot fail)
#   note         optional: a fact worth keeping beside the export
#   internal     optional: true for an F2K-internal entry point, not a Windows 2000 export
#
# A record without an impl is one of the DLL's exports F2K does not implement yet, catalogued from
# the real DLL's export table (scripts/catalogue_exports.py, over the dumps of
# scripts/dump_exports.py; the closing section's heading names the DLL and version it came from):
# its name and ordinal only, `data = true` for a variable, and a note where the DLL forwards it.
# They close the file, in ordinal order; nothing is generated for them. Implementing one moves its
# record to its group's section, with its group, args and impl.
#
# What pins an export is declared by the tests, not here: a fixture block's `[pins]` in
# tests/<fixture>/fixture.toml, a host scenario's `/// Pins:` doc line (kernel32.<Name>).
# scripts/compat.py derives each export's coverage from them and from the tests' results.
#
# kernel32 exports every function the corpus fixtures import, all of it user-mode code: its own
# (src/lib.rs, the assembly natives) over ntdll's system services, and forwarders into ntdll where
# Windows 2000 has them (RtlUnwind, the critical sections, the heap allocation calls). Two
# F2K-internal exports: BaseProcessStartThunk and BaseThreadStartThunk, where the kernel starts a
# main thread and a child thread.

[[group]]
key = "termination"
title = "termination"

[[group]]
key = "startup"
title = "command line / startup info"

[[group]]
key = "console"
title = "console handles"

[[group]]
key = "environment"
title = "environment"

[[group]]
key = "heap"
title = "heap"

[[group]]
key = "locale"
title = "locale / string conversion"

[[group]]
key = "threads"
title = "threads / sync"

[[group]]
key = "files"
title = "file handles"

[[group]]
key = "virtual-memory"
title = "virtual memory"

