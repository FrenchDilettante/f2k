[package]
name = "menushow"
version = "0.1.0"
edition = "2021"

# menushow's menu and lines, host-testable.
[lib]
name = "menushow"
path = "src/lib.rs"

# The program: menushow.exe (the target names its images .dll: the Makefile copies it to its name).
[[bin]]
name = "menushow"
path = "src/main.rs"
test = false

[dependencies]
exe = { path = "../exe" }
