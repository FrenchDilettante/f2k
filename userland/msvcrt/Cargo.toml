[package]
name = "msvcrt"
version = "0.1.0"
edition = "2021"

# msvcrt's user-mode code, host-testable: its exports' bodies and its exported variables.
[lib]
name = "msvcrt"
path = "src/lib.rs"

# The DLL: the library's exports and its entry point.
[[bin]]
name = "msvcrt"
path = "src/main.rs"
test = false

[dependencies]
rtl = { path = "../rtl" }

# The host tests take their text helpers from rtl (its `testing` module).
[dev-dependencies]
rtl = { path = "../rtl", features = ["testing"] }

# Off the DLLs' target (the host's builds, tested or not) the imports are stand-ins, rtl's shared
# ones among them (its `host` module, behind the same feature).
[target.'cfg(not(target_arch = "x86"))'.dependencies]
rtl = { path = "../rtl", features = ["testing"] }

# The build script generates the .def and the stubs' bodies from the export specs.
[build-dependencies]
exportgen = { path = "../../tools/exportgen" }
