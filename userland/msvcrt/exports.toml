# MSVCRT.dll's exports: the one source every list of them derives from (the format is
# kernel32's, documented in userland/kernel32/exports.toml).
#
# Every export is cdecl, as the C runtime's functions are (the convention below). F2K's msvcrt
# exports what the corpus fixtures (tests/crt) and cmd.exe import: its own code (src/lib.rs, and
# src/seh.s for the exception handling and setjmp exports) over kernel32, as Windows 2000's msvcrt
# imports kernel32 alone, and stubs for what is not written yet (pipes).
# Its variables (`data = true`) are its own storage (src/data.rs). The rest of the records are
# catalogued from MSVCRT.dll 6.1.9844.0's export table (scripts/catalogue_exports.py): their name
# and ordinal. Implementing one gives it its group, prototype and implementation.

convention = "cdecl"

[[group]]
key = "startup"
title = "program start-up and exit"

[[group]]
key = "exceptions"
title = "exception handling / setjmp"

[[group]]
key = "lowio"
title = "file descriptors / console input"

[[group]]
key = "stdio"
title = "stdio streams / formatted output"

[[group]]
key = "strings"
title = "strings / conversions"

[[group]]
key = "characters"
title = "wide characters"

[[group]]
key = "memory"
title = "memory"

[[group]]
key = "utility"
title = "sorting / random numbers / time / locale"

[[group]]
key = "process"
title = "child processes"

