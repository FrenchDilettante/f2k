# ntdll.dll's exports: the one source every list of them derives from (the format is kernel32's,
# documented in userland/kernel32/exports.toml).
#
# ntdll carries ntoskrnl's system services, the only exports that enter the kernel (user32 and
# gdi32 enter it too, through win32k's services, but those are their own internal calls, exported
# by none) (`impl = { syscall = "<the kernel's typed handler>" }`: the stub raises the gate on the service's
# Windows 2000 number, from w2k-services.txt, and the export is there under its Zw name too; the
# handler is `fn(&mut NtCall, <arguments>) -> NtResult`, the NTSTATUS its answer), its user-mode
# exports (RtlNtStatusToDosError, the mapping kernel32
# reports a failed service through; the exception dispatcher and RtlUnwind, which kernel32 forwards
# to; the critical sections, which kernel32's Enter, Leave, TryEnter and Delete forward to, and the
# PEB lock; the heaps, which kernel32's HeapAlloc, HeapFree, HeapReAlloc, HeapSize and HeapValidate
# forward to; the environment; the process parameters and the environment a new process starts
# with; the counted strings, the time conversions and the bitmaps kernel32's
# narrow calls, file times and TLS slots go through; the handle tables, the resources and the
# message calls kernel32's Local and Global memory and FormatMessage go through; RtlOpenCurrentUser,
# advapi32's HKEY_CURRENT_USER; an image's NT headers and execution options; LdrInitializeThunk, a
# fresh thread's first user-mode work), and the F2K-internal entry point the
# kernel sends a thread to (`internal = true`: not a Windows 2000 export).

[[group]]
key = "nt"
title = "system services"

[[group]]
key = "csr"
title = "the client-server runtime"

[[group]]
key = "exceptions"
title = "exceptions"

[[group]]
key = "threads"
title = "critical sections"

[[group]]
key = "heap"
title = "heaps"

[[group]]
key = "paths"
title = "paths, the current directory and the environment"

[[group]]
key = "processes"
title = "process parameters"

[[group]]
key = "strings"
title = "counted strings and the ANSI code page"

[[group]]
key = "registry"
title = "the registry"

[[group]]
key = "time"
title = "time conversions"

[[group]]
key = "bitmaps"
title = "bitmaps"

[[group]]
key = "handles"
title = "handle tables"

[[group]]
key = "resources"
title = "resources and messages"

[[group]]
key = "loader"
title = "the loader"

[[group]]
key = "debug"
title = "the debugger's print"

[[group]]
key = "internal"
title = "F2K-internal entry points"

