# ntdll.dll's exports: the one source every list of them derives from (the format is kernel32's,
# documented in userland/kernel32/exports.toml).
#
# ntdll carries Windows 2000's system services (`impl = { syscall = "<the kernel's typed handler>" }`:
# the stub raises the gate on the service's Windows 2000 number, from w2k-services.txt, and the
# export is there under its Zw name too; the handler is `fn(&mut NtCall, <arguments>) -> NtResult`,
# the NTSTATUS its answer), its user-mode exports (RtlNtStatusToDosError, the mapping kernel32
# reports a failed service through; the exception dispatcher and RtlUnwind, which kernel32 forwards
# to), and the F2K-internal entry point the kernel sends a thread to (`internal = true`: not a
# Windows 2000 export).

[[group]]
key = "nt"
title = "system services"

[[group]]
key = "csr"
title = "the client-server runtime"

[[group]]
key = "exceptions"
title = "exceptions"

[[group]]
key = "internal"
title = "F2K-internal entry points"

# --- system services (the kernel's NT service table, kernel/src/nt) ------------------------------

[[export]]
name = "NtClose"
group = "nt"
args = ["handle Handle"]
impl = { syscall = "crate::nt::object::close" }
pinned_by = ["files/open"]

[[export]]
name = "NtTerminateProcess"
group = "nt"
args = ["handle ProcessHandle", "u32 ExitStatus"]
impl = { syscall = "crate::nt::process::terminate_process" }
note = "the calling process's handle ends it (no other process is reachable); the null handle, ExitProcess's first step, comes with ExitProcess"
unpinned = "kernel32's TerminateProcess is its only caller, and no fixture block calls that (the C runtime's fatal paths do)"

[[export]]
name = "NtContinue"
group = "nt"
args = ["ptr Context", "u32 TestAlert"]
impl = { syscall = "crate::nt::exception::continue_context" }
note = "resumes the CONTEXT's control and integer registers (TF honoured, privileged flags masked). The debug and floating-point registers are not restored; TestAlert is ignored until user APCs are delivered through KiUserApcDispatcher"
pinned_by = ["runtime/seh", "runtime/unhandled"]

[[export]]
name = "NtRaiseException"
group = "nt"
args = ["ptr ExceptionRecord", "ptr Context", "u32 FirstChance"]
impl = { syscall = "crate::nt::exception::raise_exception" }
note = "first chance: the records copied below the context's stack pointer and KiUserExceptionDispatcher entered (no debugger); second chance: the process ends with the code (no debugger, no exception port)"
pinned_by = ["runtime/seh"]

[[export]]
name = "NtQuerySystemInformation"
group = "nt"
args = ["u32 SystemInformationClass", "ptr SystemInformation", "u32 SystemInformationLength", "ptr<u32> ReturnLength"]
impl = { syscall = "crate::nt::system::query_system_information" }
note = "answers SystemCurrentTimeZoneInformation (44) alone; the other classes are STATUS_INVALID_INFO_CLASS (the basic, processor and performance classes come with GetSystemInfo)"
unpinned = "kernel32's GetTimeZoneInformation is its caller, which no fixture block is known to reach"

[[export]]
name = "NtQueryPerformanceCounter"
group = "nt"
args = ["ptr<u64> PerformanceCounter", "ptr<u64> PerformanceFrequency"]
impl = { syscall = "crate::nt::system::query_performance_counter" }
pinned_by = ["sched/clock"]

# --- the client-server runtime (src/csr.s) --------------------------------------------------------

[[export]]
name = "CsrClientCallServer"
group = "csr"
args = ["ptr ApiMessage", "ptr CaptureBuffer", "u32 ApiNumber", "u32 ArgLength"]
impl = { native = "CsrClientCallServer" }
note = "one internal service (SYS_CSR_CALL) to the kernel's console server, F2K's stand-in for csrss"
pinned_by = ["runtime/console", "bare/badptr"]

# --- the status mapping (src/status.rs, over rtl::status) ------------------------------------------

[[export]]
name = "RtlNtStatusToDosError"
group = "nt"
args = ["u32 Status"]
impl = { native = "RtlNtStatusToDosError" }
pinned_by = ["files/open"]

# --- exceptions -----------------------------------------------------------------------------------

[[export]]
name = "KiUserExceptionDispatcher"
group = "exceptions"
args = ["ptr ExceptionRecord", "ptr Context"]
impl = { native = "KiUserExceptionDispatcher" }
note = "the kernel enters user mode here with an exception's records on the stack: the search (RtlDispatchException), then NtContinue or the second chance"
pinned_by = ["runtime/seh", "runtime/unhandled", "bare/null-write"]

[[export]]
name = "RtlRaiseException"
group = "exceptions"
args = ["ptr ExceptionRecord"]
impl = { native = "RtlRaiseException" }
pinned_by = ["runtime/seh"]

[[export]]
name = "RtlRaiseStatus"
group = "exceptions"
args = ["u32 Status"]
impl = { native = "RtlRaiseStatus" }
unpinned = "the dispatcher raises through it only when NtContinue or NtRaiseException fails, which no fixture block reaches"

[[export]]
name = "RtlUnwind"
group = "exceptions"
args = ["ptr TargetFrame", "u32 TargetIp", "ptr ExceptionRecord", "u32 ReturnValue"]
impl = { native = "RtlUnwind" }
note = "x86 NT's semantics: TargetIp ignored, the caller resumed through NtContinue; collided unwinds, INVALID_UNWIND_TARGET and BAD_STACK; a NULL target is an exit unwind, then the second chance"
pinned_by = ["runtime/seh", "runtime/unhandled", "bare/null-write"]

# --- F2K-internal entry points --------------------------------------------------------------------

[[export]]
name = "F2kThreadExitTrampoline"
group = "internal"
args = []
impl = { native = "F2kThreadExitTrampoline" }
internal = true
note = "a child thread's function returns onto it (its return value the thread's exit code): the kernel plants its address under the thread's first frame"
