[package]
name = "shutdown"
version = "0.1.0"
edition = "2021"

# shutdown's arguments and messages, host-testable.
[lib]
name = "shutdown"
path = "src/lib.rs"

# The program: shutdown.exe (the target names its images .dll: the Makefile copies it to its name).
[[bin]]
name = "shutdown"
path = "src/main.rs"
test = false

[dependencies]
exe = { path = "../exe" }
